    function FacturesTab({ profile, store, patch, askAdvisor }) {
      const [view, setView] = useState("docs");
      const [editing, setEditing] = useState(null);
      const ent = { ...EMPTY_ENT, siret: profile.siret || "", ...(store.entreprise || {}) };
      const clients = store.clients || [];
      const docs = store.docs || [];

      const newDoc = (type) => {
        const date = todayISO();
        setEditing({ id:uid(), type, numero:"", date, clientId: clients[0]?.id || "", objet:"",
          lignes:[{ designation:"", qte:1, pu:"", nature: profile.activite === "vente" ? "bien" : "service" }],
          dateOperation: date, echeance: addDays(date, Number(ent.delai) || 30), validite: addDays(date, 30), adresseLivraison:"", notes:"" });
      };

      const saveDoc = (d) => {
        const exists = docs.some(x => x.id === d.id);
        patch({ docs: exists ? docs.map(x => x.id === d.id ? d : x) : [...docs, d] });
      };
      const setDoc = (d) => { setEditing(d); if (!(d.numero && d.type === "facture" && docs.find(x => x.id === d.id)?.numero)) saveDoc(d); };

      const emit = () => {
        const d = { ...editing, numero: nextNumero(docs, editing.type, editing.date) };
        setEditing(d); saveDoc(d);
      };
      const markPaid = ({ date, mode }) => {
        const client = clients.find(c => c.id === editing.clientId);
        const d = { ...editing, payeLe: date, modePaiement: mode };
        const t = docTotals(d, profile);
        setEditing(d);
        patch({
          docs: docs.map(x => x.id === d.id ? d : x),
          recettes: [...(store.recettes || []), { id:uid(), date, client: client?.nom || "", nature: d.objet || natureOperation(d), montant: t.ttc, mode, ref: d.numero }],
        });
      };
      const del = () => {
        if (!confirm("Supprimer ce document ?")) return;
        patch({ docs: docs.filter(x => x.id !== editing.id) }); setEditing(null);
      };
      const convert = () => {
        const date = todayISO();
        const f = { ...editing, id:uid(), type:"facture", numero:"", date, echeance: addDays(date, Number(ent.delai) || 30), devisRef: editing.numero, notes: [editing.notes, `Suivant devis n° ${editing.numero}`].filter(Boolean).join(" — ") };
        saveDoc(f); setEditing(f);
      };

      const impayes = docs.filter(d => d.type === "facture" && d.numero && !d.payeLe);
      const enRetard = impayes.filter(d => d.echeance < todayISO());

      const tabs = [["docs","🧾 Documents"],["ent","🏢 Mon entreprise"],["clients","👥 Clients"],["reforme","⚡ Réforme"]];
      return (
        <div>
          <div style={{ display:"flex", gap:"6px", marginBottom:"14px", overflowX:"auto" }}>
            {tabs.map(([id, label]) => (
              <button key={id} onClick={() => setView(id)} style={{ flexShrink:0, background: view===id ? "rgba(52,211,153,0.14)" : "rgba(255,255,255,0.04)", border:`1px solid ${view===id ? "rgba(52,211,153,0.45)" : C.cardBorder}`, borderRadius:"20px", padding:"8px 13px", color: view===id ? C.accent : C.textDim, fontSize:"12px", cursor:"pointer" }}>{label}</button>
            ))}
          </div>

          {view === "docs" && (
            <>
              <div style={{ display:"flex", gap:"8px", marginBottom:"14px" }}>
                <Btn kind="primary" onClick={() => newDoc("facture")} style={{ flex:1 }}>+ Facture</Btn>
                <Btn kind="accent" onClick={() => newDoc("devis")} style={{ flex:1 }}>+ Devis</Btn>
              </div>
              {enRetard.length > 0 && (
                <Card style={{ borderColor:"rgba(251,113,133,0.4)" }}>
                  <div style={{ fontSize:"13px", color:C.danger, marginBottom:"8px" }}>⏰ {enRetard.length} facture(s) en retard de paiement — {eur(enRetard.reduce((s,d) => s + docTotals(d, profile).ttc, 0))}</div>
                  <Btn kind="gold" onClick={() => askAdvisor(`Rédige-moi un e-mail de relance courtois mais ferme pour ces factures impayées : ${enRetard.map(d => `${d.numero} (${clients.find(c=>c.id===d.clientId)?.nom}, ${eur(docTotals(d, profile).ttc)}, échue le ${fmtDate(d.echeance)})`).join(" ; ")}. Rappelle les pénalités applicables et, pour les pros, l'indemnité de 40 €.`)}>💬 Préparer les relances</Btn>
                </Card>
              )}
              {docs.length === 0 && <Card><div style={{ fontSize:"12.5px", color:C.textDim, lineHeight:"1.7" }}>Aucun document. Commence par compléter <strong>Mon entreprise</strong> et ajouter un <strong>client</strong>, puis crée ton premier devis ou ta première facture : Cap Micro vérifie automatiquement toutes les mentions obligatoires.</div></Card>}
              {[...docs].sort((a,b) => (b.date || "").localeCompare(a.date || "")).map(d => {
                const c = clients.find(x => x.id === d.clientId);
                const status = d.type === "devis" ? (d.numero ? "validé" : "brouillon") : !d.numero ? "brouillon" : d.payeLe ? "payée" : d.echeance < todayISO() ? "en retard" : "à encaisser";
                const col = { "payée":C.accent, "en retard":C.danger, "à encaisser":C.accent3, "brouillon":C.textFaint, "validé":C.accent2 }[status];
                return (
                  <button key={d.id} onClick={() => setEditing(d)} style={{ width:"100%", textAlign:"left", display:"flex", justifyContent:"space-between", alignItems:"center", gap:"10px", background:C.card, border:`1px solid ${C.cardBorder}`, borderRadius:"12px", padding:"12px 14px", marginBottom:"8px", cursor:"pointer", color:C.text }}>
                    <div>
                      <div style={{ fontSize:"13px" }}>{d.type === "facture" ? "🧾" : "📋"} {d.numero || "Brouillon"} · {c?.nom || "—"}</div>
                      <div style={{ fontSize:"11px", color:C.textFaint }}>{fmtDate(d.date)}{d.objet ? ` · ${d.objet}` : ""}</div>
                    </div>
                    <div style={{ textAlign:"right" }}>
                      <div style={{ fontSize:"13px" }}>{eur(docTotals(d, profile).ttc)}</div>
                      <div style={{ fontSize:"10.5px", color:col }}>{status}</div>
                    </div>
                  </button>
                );
              })}
            </>
          )}
          {view === "ent" && <EntrepriseForm ent={ent} setEnt={e => patch({ entreprise:e })} profile={profile} />}
          {view === "clients" && <ClientsPanel clients={clients} setClients={cl => patch({ clients:cl })} />}
          {view === "reforme" && <>
            <ReformePanel store={store} patch={patch} />
            <Card>
              <div style={{ fontSize:"13px", marginBottom:"8px" }}>Ce qu'il faut retenir</div>
              <ul style={{ margin:"0 0 10px 16px", fontSize:"12px", color:C.textDim, lineHeight:"1.8" }}>
                <li>Tu es concerné(e) même en franchise de TVA.</li>
                <li>Le PDF envoyé par e-mail ne sera plus une facture valable en B2B France à partir du {fmtDate(REGLES.facturationElec.emission)}.</li>
                <li>Formats acceptés : Factur-X (PDF + XML), UBL, CII — Cap Micro exporte déjà tes factures en XML CII.</li>
                <li>Ventes aux particuliers et à l'étranger : pas de facture électronique mais un e-reporting des montants.</li>
                <li>Amende de {REGLES.penaliteMention} € par mention manquante ; sanctions supplémentaires en cas de non-recours à la facture électronique.</li>
              </ul>
              <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
                <Btn kind="gold" onClick={() => askAdvisor("Aide-moi à choisir une plateforme agréée adaptée à ma micro-entreprise : quels critères, quelles questions poser, et quel plan d'action d'ici l'obligation d'émission ?")}>💬 Choisir ma plateforme</Btn>
                <Btn kind="gold" onClick={() => askAdvisor("Rédige un e-mail court et professionnel à envoyer à mes clients professionnels pour leur demander leur SIREN et leur adresse de facturation, en expliquant la réforme de la facture électronique.")}>💬 E-mail « SIREN » pour mes clients</Btn>
              </div>
            </Card>
          </>}

          {editing && <DocEditor doc={editing} setDoc={setDoc} onClose={() => setEditing(null)} onEmit={emit} onPaid={markPaid} onDelete={del} onConvert={convert} ent={ent} clients={clients} profile={profile} />}
        </div>
      );
    }

    // ── ONGLET SUIVI ───────────────────────────────────────────────────────

    function RegistreForm({ onAdd, kind }) {
      const [r, setR] = useState({ date: todayISO(), client:"", nature:"", montant:"", mode:"Virement", ref:"" });
      const ok = r.date && Number(r.montant) > 0;
      return (
        <div style={{ display:"flex", gap:"6px", flexWrap:"wrap", marginBottom:"10px" }}>
          <input type="date" value={r.date} onChange={e => setR({ ...r, date:e.target.value })} style={{ ...inputStyle, width:"140px", colorScheme:"dark" }} />
          <input value={r.client} onChange={e => setR({ ...r, client:e.target.value })} placeholder={kind === "achat" ? "Fournisseur" : "Client"} style={{ ...inputStyle, flex:1, minWidth:"110px" }} />
          <input value={r.nature} onChange={e => setR({ ...r, nature:e.target.value })} placeholder="Nature" style={{ ...inputStyle, flex:1, minWidth:"110px" }} />
          <input value={r.montant} onChange={e => setR({ ...r, montant:e.target.value.replace(",",".") })} placeholder="Montant €" inputMode="decimal" style={{ ...inputStyle, width:"100px" }} />
          <select value={r.mode} onChange={e => setR({ ...r, mode:e.target.value })} style={{ ...inputStyle, width:"110px" }}>{["Virement","Carte","Chèque","Espèces","Autre"].map(m => <option key={m}>{m}</option>)}</select>
          <Btn kind="accent" disabled={!ok} onClick={() => { onAdd({ ...r, id:uid(), montant: round2(r.montant) }); setR({ ...r, client:"", nature:"", montant:"", ref:"" }); }}>Ajouter</Btn>
        </div>
      );
    }

    function toCSV(rows, cols) {
      const esc = (v) => `"${String(v ?? "").replace(/"/g,'""')}"`;
      return "﻿" + [cols.map(c => esc(c[1])).join(";"), ...rows.map(r => cols.map(c => esc(c[0] === "montant" ? String(r.montant).replace(".", ",") : r[c[0]])).join(";"))].join("\n");
    }

    function SuiviTab({ profile, store, patch, askAdvisor }) {
      const a = activiteOf(profile);
      const [annee, setAnnee] = useState(new Date().getFullYear());
      const [showRegistre, setShowRegistre] = useState(false);
      const recettes = store.recettes || [];
      const achats = store.achats || [];
      const actions = store.actions || [];
      const s = computeStats(profile, recettes, annee);
      const prev = computeStats(profile, recettes, annee - 1);
      const deadlines = upcomingDeadlines(profile);
      const maxMois = Math.max(...s.parMois, 1);
      const objectif = Number(store.objectif) || 0;
      const franchise = profile.tva !== "assujetti";
      const cols = [["date","Date d'encaissement"],["client","Client"],["nature","Nature"],["montant","Montant (€)"],["mode","Mode de paiement"],["ref","Référence"]];

      const alerts = [];
      if (franchise && s.ca >= a.tvaMaj) alerts.push({ c:C.danger, t:`Seuil majoré de TVA dépassé (${eur(a.tvaMaj)}) : tu dois facturer la TVA depuis le jour du dépassement. Contacte ton SIE et demande un numéro de TVA.` });
      else if (franchise && s.ca >= a.tva) alerts.push({ c:C.accent3, t:`Seuil de franchise de TVA dépassé (${eur(a.tva)}) : tu resteras en franchise cette année tant que tu ne dépasses pas ${eur(a.tvaMaj)}, mais tu factureras la TVA à partir du 1er janvier prochain.` });
      else if (franchise && s.projection >= a.tva) alerts.push({ c:C.accent3, t:`À ce rythme (projection ${eur(s.projection)}), tu dépasseras le seuil de franchise de TVA (${eur(a.tva)}) cette année. Anticipe tes prix TTC.` });
      if (s.ca >= a.plafond) alerts.push({ c:C.danger, t:`Plafond de la micro-entreprise dépassé (${eur(a.plafond)}). Si c'est le cas 2 années de suite, tu sortiras du régime : prépare la suite avec le Conseiller.` });
      if (s.ca > REGLES.compteDedieSeuil && prev.ca > REGLES.compteDedieSeuil && !store.steps?.a_banque) alerts.push({ c:C.accent3, t:`CA > ${eur(REGLES.compteDedieSeuil)} deux années de suite : le compte bancaire dédié est obligatoire.` });

      const chiffresPourIA = `CA ${annee} : ${eur(s.ca)} ; cotisations estimées ${eur(s.cotis)} ; projection annuelle ${eur(s.projection)} ; CA ${annee-1} : ${eur(prev.ca)} ; objectif : ${objectif ? eur(objectif) : "non défini"} ; CA par mois : ${s.parMois.map(v => Math.round(v)).join(", ")}`;

      return (
        <div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"12px" }}>
            <div style={{ display:"flex", gap:"6px", alignItems:"center" }}>
              <Btn onClick={() => setAnnee(annee-1)} style={{ padding:"6px 10px" }}>‹</Btn>
              <span style={{ fontSize:"15px", minWidth:"50px", textAlign:"center" }}>{annee}</span>
              <Btn onClick={() => setAnnee(annee+1)} style={{ padding:"6px 10px" }}>›</Btn>
            </div>
            <Btn kind="gold" onClick={() => askAdvisor(`Fais-moi un bilan de mon activité et un plan de développement concret pour les 3 prochains mois. Mes chiffres : ${chiffresPourIA}. Analyse mon rythme, mes prix au regard des cotisations, mes risques (seuils, dépendance à un client) et propose des actions précises.`)}>💬 Bilan & conseils</Btn>
          </div>

          {alerts.map((al,i) => <div key={i} style={{ fontSize:"12px", color:al.c, background:"rgba(255,255,255,0.03)", border:`1px solid ${al.c}55`, borderRadius:"10px", padding:"10px 12px", marginBottom:"10px", lineHeight:"1.6" }}>⚠️ {al.t}</div>)}

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px", marginBottom:"14px" }}>
            {[
              ["CA encaissé", eur(s.ca), C.text],
              ["Cotisations estimées", eur(s.cotis), C.accent3],
              [profile.vl === "oui" ? "Impôt (versement lib.)" : "Projection annuelle", profile.vl === "oui" ? eur(s.impot) : eur(s.projection), C.accent2],
              ["Reste après prélèvements", eur(s.net), C.accent],
            ].map(([l, v, c]) => (
              <div key={l} style={{ background:C.card, border:`1px solid ${C.cardBorder}`, borderRadius:"14px", padding:"13px" }}>
                <div style={{ fontSize:"10px", letterSpacing:"1.5px", textTransform:"uppercase", color:C.textFaint, marginBottom:"4px" }}>{l}</div>
                <div style={{ fontSize:"17px", color:c }}>{v}</div>
              </div>
            ))}
          </div>

          <Card>
            <div style={{ fontSize:"13px", marginBottom:"12px" }}>📊 Chiffre d'affaires mensuel</div>
            <div style={{ display:"flex", alignItems:"flex-end", gap:"4px", height:"110px", marginBottom:"6px" }}>
              {s.parMois.map((v,i) => (
                <div key={i} title={eur(v)} style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"flex-end", height:"100%" }}>
                  <div style={{ height:`${Math.max(v ? 4 : 1, (v / maxMois) * 100)}%`, background: v ? C.grad : "rgba(255,255,255,0.08)", borderRadius:"4px 4px 0 0" }}/>
                </div>
              ))}
            </div>
            <div style={{ display:"flex", gap:"4px", fontSize:"9.5px", color:C.textFaint }}>
              {"JFMAMJJASOND".split("").map((m,i) => <div key={i} style={{ flex:1, textAlign:"center" }}>{m}</div>)}
            </div>
            <div style={{ fontSize:"11px", color:C.textFaint, marginTop:"10px" }}>
              Taux appliqués : {pct(a.taux)} % de cotisations + {pct(a.cfp)} % CFP{profile.vl === "oui" ? ` + ${pct(a.vl)} % d'impôt` : ""}{profile.acre === "oui" ? " (ACRE prise en compte sur la 1re période)" : ""}. Estimation indicative.
            </div>
          </Card>

          <Card>
            <div style={{ fontSize:"13px", marginBottom:"12px" }}>🎯 Seuils & objectif</div>
            {objectif > 0 && <Gauge label="Objectif de CA" value={s.ca} max={objectif} warnAt={2} />}
            {franchise && <Gauge label="Franchise de TVA" value={s.ca} max={a.tva} note={`Seuil majoré : ${eur(a.tvaMaj)}`} />}
            <Gauge label="Plafond micro-entreprise" value={s.ca} max={a.plafond} />
            <div style={{ display:"flex", gap:"8px", alignItems:"center" }}>
              <span style={{ fontSize:"12px", color:C.textDim }}>Objectif annuel :</span>
              <input value={store.objectif || ""} onChange={e => patch({ objectif: e.target.value.replace(/[^0-9]/g,"") })} placeholder="€" inputMode="numeric" style={{ ...inputStyle, width:"120px" }} />
            </div>
          </Card>

          <Card>
            <div style={{ fontSize:"13px", marginBottom:"10px" }}>📅 Prochaines échéances</div>
            {deadlines.map((d,i) => {
              const j = daysBetween(todayISO(), d.date);
              return (
                <div key={i} style={{ display:"flex", gap:"10px", padding:"8px 0", borderTop: i ? `1px solid ${C.cardBorder}` : "none", fontSize:"12.5px" }}>
                  <div style={{ minWidth:"78px", color: j <= 7 ? C.danger : j <= 30 ? C.accent3 : C.textDim }}>{fmtDate(d.date)}</div>
                  <div style={{ flex:1, color:C.textDim }}>{d.label}</div>
                  <div style={{ fontSize:"11px", color:C.textFaint }}>J-{j}</div>
                </div>
              );
            })}
          </Card>

          <Card>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"10px" }}>
              <div style={{ fontSize:"13px" }}>✅ Mes actions</div>
              <span style={{ fontSize:"11px", color:C.textFaint }}>{actions.filter(x => !x.done).length} en cours</span>
            </div>
            {actions.length === 0 && <div style={{ fontSize:"12px", color:C.textFaint, fontStyle:"italic" }}>Le Conseiller ajoutera ici les actions concrètes qu'il te recommande.</div>}
            {actions.map(x => (
              <div key={x.id} style={{ display:"flex", gap:"10px", alignItems:"flex-start", padding:"8px 0", borderTop:`1px solid ${C.cardBorder}` }}>
                <button onClick={() => patch({ actions: actions.map(y => y.id === x.id ? { ...y, done:!y.done } : y) })} style={{ width:"20px", height:"20px", borderRadius:"6px", flexShrink:0, cursor:"pointer", background: x.done ? C.accent : "transparent", border:`1.5px solid ${x.done ? C.accent : C.textFaint}`, color:"#0b1220", fontSize:"12px" }}>{x.done ? "✓" : ""}</button>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:"12.5px", color: x.done ? C.textFaint : C.text, textDecoration: x.done ? "line-through" : "none" }}>{x.titre}{x.echeance ? <span style={{ fontSize:"11px", color:C.accent3 }}> · {fmtDate(x.echeance)}</span> : null}</div>
                  {x.detail && !x.done && <div style={{ fontSize:"11.5px", color:C.textFaint, lineHeight:"1.6" }}>{x.detail}</div>}
                </div>
                <button onClick={() => patch({ actions: actions.filter(y => y.id !== x.id) })} style={{ background:"transparent", border:"none", color:C.textFaint, cursor:"pointer" }}>×</button>
              </div>
            ))}
          </Card>

          <Card>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"10px", gap:"8px", flexWrap:"wrap" }}>
              <div style={{ fontSize:"13px" }}>📒 Livre des recettes ({s.nb} en {annee})</div>
              <div style={{ display:"flex", gap:"6px" }}>
                <Btn onClick={() => setShowRegistre(!showRegistre)} style={{ padding:"6px 10px" }}>{showRegistre ? "Masquer" : "Afficher / ajouter"}</Btn>
                <Btn kind="accent" onClick={() => downloadFile(`livre-des-recettes-${annee}.csv`, toCSV(recettes.filter(r => r.date.startsWith(String(annee))).sort((x,y) => x.date.localeCompare(y.date)), cols), "text/csv;charset=utf-8")} style={{ padding:"6px 10px" }}>⬇ CSV</Btn>
              </div>
            </div>
            <div style={{ fontSize:"11px", color:C.textFaint, marginBottom:"8px" }}>Alimenté automatiquement quand tu marques une facture payée. Ajoute ici les encaissements sans facture (ventes aux particuliers, etc.).</div>
            {showRegistre && <>
              <RegistreForm onAdd={r => patch({ recettes:[...recettes, r] })} />
              {recettes.filter(r => r.date.startsWith(String(annee))).sort((x,y) => y.date.localeCompare(x.date)).map(r => (
                <div key={r.id} style={{ display:"flex", gap:"8px", fontSize:"12px", padding:"6px 0", borderTop:`1px solid ${C.cardBorder}`, alignItems:"center" }}>
                  <span style={{ minWidth:"76px", color:C.textFaint }}>{fmtDate(r.date)}</span>
                  <span style={{ flex:1, color:C.textDim }}>{r.client}{r.nature ? ` — ${r.nature}` : ""}{r.ref ? ` (${r.ref})` : ""}</span>
                  <span>{eur(r.montant)}</span>
                  <button onClick={() => confirm("Supprimer cette recette ?") && patch({ recettes: recettes.filter(x => x.id !== r.id) })} style={{ background:"transparent", border:"none", color:C.textFaint, cursor:"pointer" }}>×</button>
                </div>
              ))}
            </>}
          </Card>

          {profile.activite === "vente" && (
            <Card>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"10px" }}>
                <div style={{ fontSize:"13px" }}>🛒 Registre des achats</div>
                <Btn kind="accent" onClick={() => downloadFile(`registre-des-achats-${annee}.csv`, toCSV(achats.filter(r => r.date.startsWith(String(annee))), [["date","Date"],["client","Fournisseur"],["nature","Nature"],["montant","Montant (€)"],["mode","Mode de paiement"]]), "text/csv;charset=utf-8")} style={{ padding:"6px 10px" }}>⬇ CSV</Btn>
              </div>
              <RegistreForm kind="achat" onAdd={r => patch({ achats:[...achats, r] })} />
              {achats.filter(r => r.date.startsWith(String(annee))).sort((x,y) => y.date.localeCompare(x.date)).map(r => (
                <div key={r.id} style={{ display:"flex", gap:"8px", fontSize:"12px", padding:"6px 0", borderTop:`1px solid ${C.cardBorder}` }}>
                  <span style={{ minWidth:"76px", color:C.textFaint }}>{fmtDate(r.date)}</span>
                  <span style={{ flex:1, color:C.textDim }}>{r.client}{r.nature ? ` — ${r.nature}` : ""}</span>
                  <span>{eur(r.montant)}</span>
                  <button onClick={() => patch({ achats: achats.filter(x => x.id !== r.id) })} style={{ background:"transparent", border:"none", color:C.textFaint, cursor:"pointer" }}>×</button>
                </div>
              ))}
            </Card>
          )}
        </div>
      );
    }

    // ── ONGLET CONSEILLER ──────────────────────────────────────────────────

    function renderInline(text) {
      // **gras** et liens https://
      const parts = text.split(/(\*\*[^*]+\*\*|https?:\/\/[^\s)]+)/g);
      return parts.map((part, i) => {
        if (/^\*\*[^*]+\*\*$/.test(part)) return <strong key={i} style={{ color:C.text }}>{part.slice(2,-2)}</strong>;
        if (/^https?:\/\//.test(part)) return <a key={i} href={part} target="_blank" rel="noopener" style={{ color:C.accent, wordBreak:"break-all" }}>{part}</a>;
        return <React.Fragment key={i}>{part}</React.Fragment>;
      });
    }

    function ChatMessage({ msg, onSuggestionClick }) {
      if (msg.hidden) return null;
      const isUser = msg.role === "user";
      if (isUser) {
        return (
          <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:"12px" }}>
            <div style={{ background:"rgba(52,211,153,0.13)", border:"1px solid rgba(52,211,153,0.3)", borderRadius:"16px 16px 4px 16px", padding:"10px 14px", maxWidth:"85%", fontSize:"13px", lineHeight:"1.6", whiteSpace:"pre-wrap" }}>{msg.content}</div>
          </div>
        );
      }
      const { clean: noAct, blocks: acts } = extractBlocks(msg.content, "action");
      const { clean, blocks: sugg } = extractBlocks(noAct, "suggestions");
      const suggestions = sugg[0] || [];
      return (
        <div style={{ marginBottom:"14px", animation:"fadeIn 0.3s ease" }}>
          <div style={{ background:C.card, border:`1px solid ${C.cardBorder}`, borderRadius:"16px 16px 16px 4px", padding:"12px 15px", fontSize:"13px", lineHeight:"1.7", color:C.textDim }}>
            {clean.split("\n").map((line, i) => {
              if (/^#{1,4}\s/.test(line)) return <div key={i} style={{ color:C.accent3, fontSize:"13.5px", margin:"8px 0 4px" }}>{renderInline(line.replace(/^#+\s/, ""))}</div>;
              if (/^\s*[-•*]\s/.test(line)) return <div key={i} style={{ paddingLeft:"14px", position:"relative" }}><span style={{ position:"absolute", left:0, color:C.accent }}>•</span>{renderInline(line.replace(/^\s*[-•*]\s/, ""))}</div>;
              if (!line.trim()) return <div key={i} style={{ height:"8px" }}/>;
              return <div key={i}>{renderInline(line)}</div>;
            })}
          </div>
          {acts.length > 0 && (
            <div style={{ marginTop:"8px" }}>
              {acts.map((a,i) => (
                <div key={i} style={{ fontSize:"12px", background:"rgba(251,191,36,0.07)", border:"1px solid rgba(251,191,36,0.3)", borderRadius:"10px", padding:"8px 12px", marginBottom:"6px", color:C.textDim }}>
                  <span style={{ color:C.accent3 }}>✅ Ajouté à mes actions :</span> {a.titre}{a.echeance ? ` (avant le ${fmtDate(a.echeance)})` : ""}
                </div>
              ))}
            </div>
          )}
          {suggestions.length > 0 && (
            <div style={{ display:"flex", flexWrap:"wrap", gap:"6px", marginTop:"8px" }}>
              {suggestions.map((s,i) => <button key={i} onClick={() => onSuggestionClick(s)} style={{ background:"rgba(129,140,248,0.1)", border:"1px solid rgba(129,140,248,0.35)", borderRadius:"16px", padding:"6px 12px", color:C.accent2, fontSize:"12px", cursor:"pointer" }}>{s}</button>)}
            </div>
          )}
        </div>
      );
    }

    const STARTERS = [
      "Quelle est la prochaine démarche la plus urgente pour moi ?",
      "Comment fixer mes prix en tenant compte des cotisations ?",
      "Explique-moi simplement la facture électronique pour ma situation",
      "Rédige mes conditions générales de vente",
      "Versement libératoire : est-ce intéressant pour moi ?",
      "Comment trouver mes premiers clients ?",
    ];

    function ConseillerTab({ profile, store, patch, pending, clearPending, onNeedKey, hasKey }) {
      const [input, setInput] = useState("");
      const [askConsent, setAskConsent] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const endRef = useRef(null);
      const messages = store.messages || [];
      const setMessages = (m) => patch({ messages: m });

      const ctx = useMemo(() => {
        const steps = buildChecklist(profile);
        const done = store.steps || {};
        const todo = steps.filter(s => !done[s.id]);
        const s = computeStats(profile, store.recettes || [], new Date().getFullYear());
        return {
          avancement: `${steps.length - todo.length}/${steps.length} étapes faites. Restant à faire : ${todo.map(t => `${t.titre}${t.obligatoire ? " [obligatoire]" : ""}`).join(" ; ") || "rien"}`,
          chiffres: `CA encaissé ${eur(s.ca)} (${s.nb} encaissements) ; cotisations estimées ${eur(s.cotis)} ; projection annuelle ${eur(s.projection)} ; factures impayées : ${(store.docs || []).filter(d => d.type === "facture" && d.numero && !d.payeLe).length} ; objectif : ${store.objectif ? eur(store.objectif) : "non défini"}`,
          actions: (store.actions || []).filter(a => !a.done).map(a => `- ${a.titre}`).join("\n") || "aucune",
        };
      }, [profile, store.steps, store.recettes, store.docs, store.actions, store.objectif]);

      useEffect(() => { endRef.current?.scrollIntoView({ behavior:"smooth" }); }, [messages.length, loading]);

      const send = useCallback(async (text) => {
        if (!text.trim() || loading) return;
        if (!aiAvailable()) { setInput(text); onNeedKey(); return; }
        if (!store.aiConsent) { setInput(text); setAskConsent(true); return; }
        const next = [...messages, { role:"user", content:text.trim() }];
        setMessages(next); setInput(""); setLoading(true); setError("");
        try {
          const history = next.slice(-20).map(m => ({ role:m.role, content:m.content }));
          const reply = await callAPI(buildAdvisorSystem(profile, ctx), history, 2000);
          const { blocks } = extractBlocks(reply, "action");
          const newActions = blocks.filter(b => b.titre).map(b => ({ id:uid(), titre:b.titre, echeance:b.echeance || "", detail:b.detail || "", done:false }));
          patch({ messages: [...next, { role:"assistant", content:reply }], ...(newActions.length ? { actions: [...(store.actions || []), ...newActions] } : {}) });
        } catch(e) {
          setError(e.message === "NO_KEY" ? "Clé API manquante." : (e.message || "Erreur de connexion."));
        }
        setLoading(false);
      }, [messages, loading, profile, ctx, store.actions, store.aiConsent, patch, onNeedKey]);

      useEffect(() => {
        if (pending && !loading) { clearPending(); send(pending); }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [pending]);

      return (
        <div>
          {askConsent && (
            <Card style={{ borderColor:"rgba(52,211,153,0.4)" }}>
              <div style={{ fontSize:"13px", color:C.accent, marginBottom:"6px" }}>🔒 Avant de commencer</div>
              <div style={{ fontSize:"12px", color:C.textDim, lineHeight:"1.7", marginBottom:"10px" }}>
                Pour te répondre, le Conseiller envoie ta question, ton profil (activité, situation, options), l'avancement de tes démarches et tes totaux de chiffre d'affaires à <strong>Anthropic (modèle Claude)</strong>, un service d'IA tiers. Le détail de tes factures, ton fichier clients et ton IBAN ne sont pas envoyés, sauf ce que tu écris toi-même dans une question (par exemple une demande de relance). Ces données ne servent pas à entraîner les modèles d'IA.
                Tu peux retirer ton accord à tout moment dans les réglages.
              </div>
              <div style={{ display:"flex", gap:"8px" }}>
                <Btn kind="primary" onClick={() => { patch({ aiConsent: todayISO() }); setAskConsent(false); }}>J'accepte</Btn>
                <Btn onClick={() => setAskConsent(false)}>Pas maintenant</Btn>
              </div>
            </Card>
          )}
          {!hasKey && (
            <Card style={{ borderColor:"rgba(251,191,36,0.35)" }}>
              <div style={{ fontSize:"13px", color:C.accent3, marginBottom:"6px" }}>🔑 Active le Conseiller IA</div>
              <div style={{ fontSize:"12px", color:C.textDim, marginBottom:"10px", lineHeight:"1.7" }}>Il répond à tes questions en tenant compte de ton profil, de ton avancement et de tes chiffres, rédige tes courriers, CGV et relances, et te propose des actions concrètes.</div>
              <Btn kind="gold" onClick={onNeedKey}>Configurer ma clé</Btn>
            </Card>
          )}
          {messages.length === 0 && (
            <div style={{ marginBottom:"14px" }}>
              <div style={{ fontSize:"13px", color:C.textDim, marginBottom:"10px", lineHeight:"1.7" }}>
                Bonjour {profile.prenom} 👋 Je connais ton profil, ta checklist et tes chiffres. Pose-moi n'importe quelle question sur ton auto-entreprise.
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
                {STARTERS.map(s => <button key={s} onClick={() => send(s)} style={{ textAlign:"left", background:"rgba(129,140,248,0.08)", border:"1px solid rgba(129,140,248,0.3)", borderRadius:"12px", padding:"10px 13px", color:C.accent2, fontSize:"12.5px", cursor:"pointer" }}>{s}</button>)}
              </div>
            </div>
          )}
          {messages.map((m,i) => <ChatMessage key={i} msg={m} onSuggestionClick={send} />)}
          {loading && (
            <div style={{ display:"flex", alignItems:"center", gap:"8px", padding:"6px 0" }}>
              <span style={{ display:"inline-block", animation:"spin 1.4s linear infinite" }}>🚀</span>
              <span style={{ fontSize:"12px", color:C.textFaint, fontStyle:"italic", animation:"pulse 2s ease infinite" }}>Cap Micro réfléchit…</span>
            </div>
          )}
          {error && <div style={{ background:"rgba(251,113,133,0.1)", border:"1px solid rgba(251,113,133,0.3)", borderRadius:"10px", padding:"11px 14px", fontSize:"12px", color:C.danger, marginBottom:"12px" }}>⚠️ {error}</div>}
          {messages.length > 0 && <div style={{ textAlign:"center", margin:"4px 0 10px" }}><button onClick={() => confirm("Effacer la conversation ?") && setMessages([])} style={{ background:"transparent", border:"none", color:C.textFaint, fontSize:"11px", cursor:"pointer", fontStyle:"italic" }}>🧹 Nouvelle conversation</button></div>}
          <div ref={endRef}/>

          <div className="no-print" style={{ position:"fixed", bottom:"calc(env(safe-area-inset-bottom,0px) + 62px)", left:0, right:0, zIndex:10, background:"linear-gradient(0deg,#0b1220 65%,rgba(11,18,32,0))" }}>
            <div style={{ maxWidth:"680px", margin:"0 auto", padding:"14px 16px 8px", display:"flex", gap:"8px" }}>
              <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key==="Enter" && send(input)}
                placeholder="Pose ta question…" style={{ flex:1, background:"rgba(255,255,255,0.07)", border:`1px solid ${C.cardBorder}`, borderRadius:"22px", padding:"12px 18px", color:C.text, fontSize:"13px", outline:"none" }} />
              <button onClick={() => send(input)} disabled={!input.trim() || loading} style={{ background: input.trim() && !loading ? C.grad : "rgba(255,255,255,0.06)", border:"none", borderRadius:"50%", width:"44px", height:"44px", flexShrink:0, color: input.trim() && !loading ? "#0b1220" : "rgba(255,255,255,0.2)", fontSize:"16px", cursor: input.trim() && !loading ? "pointer" : "not-allowed" }}>↑</button>
            </div>
          </div>
          <div style={{ height:"70px" }}/>
        </div>
      );
    }

    // ── RÉGLAGES ───────────────────────────────────────────────────────────

    function SettingsModal({ store, onClose, onEditProfile, onReset, onImport, onKeyChange, onRevokeConsent }) {
      const fileRef = useRef(null);
      const importFile = (e) => {
        const f = e.target.files?.[0]; if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try { const data = JSON.parse(reader.result); if (!data.profile) throw new Error(); onImport(data); onClose(); }
          catch(err) { alert("Fichier de sauvegarde invalide."); }
        };
        reader.readAsText(f);
      };
      return (
        <Modal onClose={onClose}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"16px" }}>
            <div style={{ fontSize:"15px", color:C.accent }}>⚙️ Réglages</div>
            <Btn onClick={onClose} style={{ padding:"6px 10px" }}>✕</Btn>
          </div>
          <SLabel>Conseiller IA</SLabel>
          <div style={{ marginBottom:"20px" }}>
            {APP_CONFIG.aiProxyUrl
              ? <div style={{ fontSize:"12.5px", color:C.textDim, lineHeight:"1.7" }}>✓ Le Conseiller est inclus dans l'application, aucune clé n'est nécessaire.</div>
              : <ApiKeyForm onSaved={onKeyChange} />}
            {store.aiConsent && <div style={{ marginTop:"10px", fontSize:"12px", color:C.textDim }}>
              Partage avec l'IA accepté le {fmtDate(store.aiConsent)}. <button onClick={onRevokeConsent} style={{ background:"transparent", border:"none", color:C.accent, cursor:"pointer", textDecoration:"underline", fontSize:"12px" }}>Retirer mon accord</button>
            </div>}
          </div>
          <SLabel>Mon profil</SLabel>
          <Btn onClick={onEditProfile} style={{ width:"100%", marginBottom:"20px" }}>✏️ Modifier mon profil (la checklist s'adapte)</Btn>
          <SLabel>Mes données (stockées sur cet appareil uniquement)</SLabel>
          <div style={{ display:"flex", gap:"8px", flexWrap:"wrap", marginBottom:"20px" }}>
            <Btn kind="accent" onClick={() => downloadFile(`cap-micro-sauvegarde-${todayISO()}.json`, JSON.stringify(store, null, 2), "application/json")}>⬇ Sauvegarder</Btn>
            <Btn onClick={() => fileRef.current?.click()}>⬆ Restaurer</Btn>
            <input ref={fileRef} type="file" accept="application/json" onChange={importFile} style={{ display:"none" }} />
            <Btn kind="danger" onClick={onReset}>Tout effacer</Btn>
          </div>
          <div style={{ fontSize:"11px", color:C.textFaint, lineHeight:"1.7" }}>
            Règles fiscales et sociales à jour de {REGLES.majLe}. Cap Micro est un outil d'aide à la gestion : il ne remplace pas les sites officiels ni le conseil personnalisé d'un expert-comptable ou d'un avocat. Les formalités restent déposées par toi sur les sites officiels (gratuits).
          </div>
        </Modal>
      );
    }

    // ── APP ────────────────────────────────────────────────────────────────

    const STORE_KEY = "capmicro_data";
    const EMPTY_STORE = { profile:null, steps:{}, entreprise:null, clients:[], docs:[], recettes:[], achats:[], actions:[], messages:[], objectif:"" };

    let nativeSaveTimer = null;
    function persistNative(json) {
      const Preferences = nativePlugin("Preferences");
      if (!Preferences) return;
      clearTimeout(nativeSaveTimer);
      nativeSaveTimer = setTimeout(() => Preferences.set({ key:STORE_KEY, value:json }).catch(() => {}), 400);
    }

    // Au démarrage sur mobile : restaure les données si le système a vidé le stockage de la WebView
    async function restoreNative() {
      const Preferences = nativePlugin("Preferences");
      if (!Preferences) return;
      try {
        const { value } = await Preferences.get({ key:STORE_KEY });
        if (value && !localStorage.getItem(STORE_KEY)) localStorage.setItem(STORE_KEY, value);
      } catch(e) {}
    }

    function loadStore() {
      try { const v = localStorage.getItem(STORE_KEY); return v ? { ...EMPTY_STORE, ...JSON.parse(v) } : EMPTY_STORE; } catch(e) { return EMPTY_STORE; }
    }

    const TABS = [
      { id:"creation",  label:"Démarches", emoji:"🏁" },
      { id:"factures",  label:"Factures",  emoji:"🧾" },
      { id:"suivi",     label:"Suivi",     emoji:"📊" },
      { id:"conseil",   label:"Conseiller",emoji:"💬" },
    ];

    function App() {
      const [store, setStore] = useState(loadStore);
      const [tab, setTab] = useState(() => localStorage.getItem("capmicro_tab") || "creation");
      const [editingProfile, setEditingProfile] = useState(false);
      const [settings, setSettings] = useState(false);
      const [pending, setPending] = useState(null);
      const [hasKey, setHasKey] = useState(aiAvailable);

      const patch = useCallback((changes) => {
        setStore(prev => {
          const next = { ...prev, ...changes };
          const json = JSON.stringify(next);
          try { localStorage.setItem(STORE_KEY, json); } catch(e) { alert("Stockage plein : exporte une sauvegarde depuis les réglages."); }
          persistNative(json);
          return next;
        });
      }, []);

      useEffect(() => { localStorage.setItem("capmicro_tab", tab); window.scrollTo(0,0); }, [tab]);

      const askAdvisor = (question) => { setPending(question); setTab("conseil"); };

      const completeProfile = (p) => {
        const isFirst = !store.profile;
        const changes = { profile:p };
        if (isFirst && p.etat === "creee") {
          // entreprise déjà créée : on pré-coche les étapes antérieures à l'immatriculation
          const pre = {};
          buildChecklist(p).filter(s => s.phase === "preparer" || s.phase === "declarer" || s.id === "a_siret").forEach(s => { pre[s.id] = true; });
          changes.steps = { ...store.steps, ...pre };
        }
        if (!store.entreprise) changes.entreprise = { ...EMPTY_ENT, siret: p.siret || "" };
        patch(changes);
        setEditingProfile(false);
      };

      const reset = () => {
        if (!confirm("Effacer toutes tes données Cap Micro sur cet appareil (profil, factures, livre des recettes, conversation) ? Pense à faire une sauvegarde avant.")) return;
        localStorage.removeItem(STORE_KEY);
        nativePlugin("Preferences")?.remove({ key:STORE_KEY }).catch(() => {});
        setStore(EMPTY_STORE); setSettings(false); setTab("creation");
      };

      if (!store.profile || editingProfile) {
        return <><OnboardingWizard initial={store.profile} onComplete={completeProfile} onCancel={store.profile ? () => setEditingProfile(false) : null} /><InstallBanner /></>;
      }

      const p = store.profile;
      const a = activiteOf(p);
      const common = { profile:p, store, patch, askAdvisor };

      return (
        <div style={{ minHeight:"100vh", background:C.bg, fontFamily:"Georgia, serif", color:C.text }}>
          <div style={{ position:"fixed", top:"-15%", right:"-10%", width:"400px", height:"400px", borderRadius:"50%", background:"radial-gradient(circle,rgba(52,211,153,0.07),transparent 70%)", pointerEvents:"none", zIndex:0 }}/>
          <div style={{ position:"fixed", bottom:"5%", left:"-15%", width:"380px", height:"380px", borderRadius:"50%", background:"radial-gradient(circle,rgba(129,140,248,0.07),transparent 70%)", pointerEvents:"none", zIndex:0 }}/>

          <div className="no-print" style={{ position:"relative", zIndex:1, maxWidth:"680px", margin:"0 auto", padding:"18px 16px calc(env(safe-area-inset-bottom,0px) + 90px)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"18px" }}>
              <div>
                <div style={{ fontSize:"10px", letterSpacing:"3px", color:C.accent3, textTransform:"uppercase" }}>Cap Micro 🚀</div>
                <div style={{ fontSize:"12px", color:C.textFaint, fontStyle:"italic" }}>{p.prenom} · {a.emoji} {a.label}</div>
              </div>
              <button onClick={() => setSettings(true)} aria-label="Réglages" style={{ background:"rgba(255,255,255,0.05)", border:`1px solid ${C.cardBorder}`, borderRadius:"50%", width:"38px", height:"38px", color:C.textDim, fontSize:"16px", cursor:"pointer" }}>⚙️</button>
            </div>

            <div key={tab} style={{ animation:"fadeIn 0.3s ease" }}>
              {tab === "creation" && <CreationTab {...common} />}
              {tab === "factures" && <FacturesTab {...common} />}
              {tab === "suivi"    && <SuiviTab {...common} />}
              {tab === "conseil"  && <ConseillerTab {...common} pending={pending} clearPending={() => setPending(null)} onNeedKey={() => setSettings(true)} hasKey={hasKey || aiAvailable()} />}
            </div>

            <div style={{ textAlign:"center", marginTop:"26px", fontSize:"10.5px", color:C.textFaint, lineHeight:"1.7" }}>
              Règles à jour de {REGLES.majLe} · outil d'aide, ne remplace pas un professionnel du chiffre ou du droit.<br/>
              <a href="https://rasarivo.github.io/Glowup/capmicro/confidentialite.html" target="_blank" rel="noopener" style={{ color:C.textFaint }}>Confidentialité</a>
              {!IS_NATIVE && <span className="web-only"> · <a href="orientation.html" style={{ color:C.textFaint }}>🧭 Boussole</a> · <a href="index.html" style={{ color:C.textFaint }}>✨ Glow Up</a></span>}
            </div>
          </div>

          <nav className="no-print" style={{ position:"fixed", bottom:0, left:0, right:0, zIndex:20, background:"rgba(11,18,32,0.97)", borderTop:`1px solid ${C.cardBorder}`, paddingBottom:"env(safe-area-inset-bottom, 0px)", backdropFilter:"blur(16px)" }}>
            <div style={{ maxWidth:"680px", margin:"0 auto", display:"flex" }}>
              {TABS.map(t => (
                <button key={t.id} onClick={() => setTab(t.id)} style={{ flex:1, background:"transparent", border:"none", padding:"9px 0 10px", cursor:"pointer", color: tab===t.id ? C.accent : C.textFaint, display:"flex", flexDirection:"column", alignItems:"center", gap:"2px" }}>
                  <span style={{ fontSize:"19px", filter: tab===t.id ? "none" : "grayscale(0.6)" }}>{t.emoji}</span>
                  <span style={{ fontSize:"10.5px" }}>{t.label}</span>
                </button>
              ))}
            </div>
          </nav>

          {settings && <SettingsModal store={store} onClose={() => setSettings(false)} onEditProfile={() => { setSettings(false); setEditingProfile(true); }} onReset={reset}
            onImport={(data) => patch({ ...EMPTY_STORE, ...data })} onKeyChange={() => setHasKey(aiAvailable())} onRevokeConsent={() => patch({ aiConsent:null })} />}
          <InstallBanner />
        </div>
      );
    }

    restoreNative().finally(() => ReactDOM.createRoot(document.getElementById("root")).render(<App />));
  </script>
</body>
</html>
