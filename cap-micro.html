  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    select option { color: #111; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback, useMemo } = React;

    // ── PALETTE ────────────────────────────────────────────────────────────
    const C = {

    const ACTIVITES = [
      { id:"vente",   emoji:"🛍️", label:"Vente de marchandises", sub:"Commerce, e-commerce, restauration, hébergement", nature:"BIC", chambre:"CCI",
        taux:12.3, cfp:0.1, vl:1.0, abattement:71, plafond:203100, tva:85000, tvaMaj:93500 },
      { id:"services_com", emoji:"🧰", label:"Prestations de services commerciales", sub:"Conciergerie, location meublée, agent commercial…", nature:"BIC", chambre:"CCI",
        taux:21.2, cfp:0.1, vl:1.7, abattement:50, plafond:83600, tva:37500, tvaMaj:41250 },
      { id:"artisan", emoji:"🔨", label:"Activité artisanale", sub:"Bâtiment, coiffure, esthétique, réparation, alimentation…", nature:"BIC", chambre:"CMA",
        taux:21.2, cfp:0.3, vl:1.7, abattement:50, plafond:83600, tva:37500, tvaMaj:41250 },
      { id:"liberal", emoji:"💻", label:"Profession libérale non réglementée", sub:"Conseil, formation, dev web, design, coaching…", nature:"BNC", chambre:"—",
        taux:25.6, cfp:0.2, vl:2.2, abattement:34, plafond:83600, tva:37500, tvaMaj:41250 },
      { id:"cipav", emoji:"📐", label:"Libéral relevant de la Cipav", sub:"Architecte, géomètre, ostéopathe, psychologue…", nature:"BNC", chambre:"—",
        taux:23.2, cfp:0.2, vl:2.2, abattement:34, plafond:83600, tva:37500, tvaMaj:41250 },
    ];

    const SITUATIONS = [
      { id:"salarie",   label:"Salarié(e) du privé" },
      { id:"fonctionnaire", label:"Agent public / fonctionnaire" },
      { id:"chomage",   label:"Demandeur d'emploi (France Travail)" },
      { id:"rsa",       label:"Bénéficiaire du RSA" },
      { id:"etudiant",  label:"Étudiant(e)" },
      { id:"retraite",  label:"Retraité(e)" },
      { id:"autre",     label:"Sans activité / autre" },
    ];

    const CLIENTS = [
      { id:"b2c",  label:"Des particuliers" },
      { id:"b2b",  label:"Des professionnels (entreprises, associations, administrations)" },
      { id:"mixte",label:"Les deux" },
    ];

    const LIEUX = [
      { id:"domicile",  label:"À mon domicile" },
      { id:"local",     label:"Dans un local (boutique, atelier, bureau)" },
      { id:"itinerant", label:"Itinérant / chez mes clients / sur les marchés" },
    ];

    const TRISTATE = ["oui", "non", "je ne sais pas"];

    // ── HELPERS ────────────────────────────────────────────────────────────

    const EUR = new Intl.NumberFormat("fr-FR", { style:"currency", currency:"EUR" });
    const eur = (n) => EUR.format(Number(n) || 0);
    const todayISO = () => new Date().toISOString().slice(0,10);
    const fmtDate = (iso) => iso ? new Date(iso + "T12:00:00").toLocaleDateString("fr-FR") : "—";
    const addDays = (iso, d) => { const x = new Date(iso + "T12:00:00"); x.setDate(x.getDate() + d); return x.toISOString().slice(0,10); };
    const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
    const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    const pct = (n) => String(n).replace(".", ",");
    const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
    const activiteOf = (p) => ACTIVITES.find(a => a.id === p?.activite) || ACTIVITES[1];
    const isB2C = (p) => p?.clients === "b2c" || p?.clients === "mixte";
    const isB2B = (p) => p?.clients === "b2b" || p?.clients === "mixte";
    const lastDayOfMonth = (y, m) => new Date(y, m + 1, 0).getDate(); // m : 0-11
    const iso = (y, m, d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const escXml = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

    // ── CONFIGURATION & MOBILE NATIF ────────────────────────────────────
    // La version App Store / Play Store injecte window.CAPMICRO_CONFIG (voir mobile/scripts/build-web.mjs).

    const APP_CONFIG = {
      aiProxyUrl: "",      // proxy serveur du Conseiller (la clé API reste sur le serveur)
      aiClientToken: "",   // jeton public de l'application, vérifié par le proxy
      vendor: {
        jspdf: "https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js",
        html2canvas: "https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js",
      },
      ...(window.CAPMICRO_CONFIG || {}),
    };
    const IS_NATIVE = !!(window.Capacitor?.isNativePlatform && window.Capacitor.isNativePlatform());
    const nativePlugin = (name) => IS_NATIVE && window.Capacitor.registerPlugin ? window.Capacitor.registerPlugin(name) : null;

    const loadedScripts = {};
    function loadScript(src) {
      if (!loadedScripts[src]) loadedScripts[src] = new Promise((resolve, reject) => {
        const el = document.createElement("script");
        el.src = src; el.onload = resolve; el.onerror = () => { delete loadedScripts[src]; reject(new Error("Chargement impossible : " + src)); };
        document.head.appendChild(el);
      });
      return loadedScripts[src];
    }

    // Enregistre un fichier : téléchargement sur le web, feuille de partage sur mobile.
    // content : texte, ou { base64 } pour un fichier binaire.
    async function downloadFile(name, content, type = "text/plain;charset=utf-8") {
      if (IS_NATIVE) {
        try {
          const Filesystem = nativePlugin("Filesystem"), Share = nativePlugin("Share");
          const isB64 = typeof content === "object" && content.base64;
          const res = await Filesystem.writeFile({ path:name, data: isB64 ? content.base64 : content, directory:"CACHE", ...(isB64 ? {} : { encoding:"utf8" }) });
          await Share.share({ title:name, files:[res.uri] });
        } catch(e) {
          if (!/cancel/i.test(e?.message || "")) alert("Impossible de partager le fichier : " + (e?.message || e));
        }
        return;
      }
      const blob = typeof content === "object" && content.base64
        ? new Blob([Uint8Array.from(atob(content.base64), c => c.charCodeAt(0))], { type })
        : new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // PDF d'un document rendu dans #print-area (A4, multi-pages)
    async function exportPdf(filename) {
      await loadScript(APP_CONFIG.vendor.html2canvas);
      await loadScript(APP_CONFIG.vendor.jspdf);
      const el = document.getElementById("print-area");
      const canvas = await window.html2canvas(el, { scale:2, backgroundColor:"#ffffff" });
      const pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4" });
      const pageW = 210, pageH = 297;
      const imgH = canvas.height * pageW / canvas.width;
      const img = canvas.toDataURL("image/jpeg", 0.92);
      for (let y = 0; y < imgH; y += pageH) {
        if (y > 0) pdf.addPage();
        pdf.addImage(img, "JPEG", 0, -y, pageW, imgH);
      }
      const base64 = pdf.output("datauristring").split(",")[1];
      await downloadFile(filename, { base64 }, "application/pdf");
    }

    // ── CHECKLIST DE CRÉATION (règles déterministes : rien n'est oublié) ──

    const PHASES = [
      { id:"preparer",  label:"Préparer",                 emoji:"🧭" },
      { id:"declarer",  label:"Déclarer l'entreprise",    emoji:"📝" },
      { id:"apres",     label:"Après l'immatriculation",  emoji:"🏁" },
      { id:"efacture",  label:"Facturation électronique", emoji:"⚡" },
      { id:"quotidien", label:"Au quotidien",             emoji:"🔁" },
    ];

    function buildChecklist(p) {
      const a = activiteOf(p);
      const S = [];
      const add = (s) => S.push({ obligatoire:true, comment:[], ...s });

      // 1. PRÉPARER
      add({ id:"p_eligibilite", phase:"preparer", titre:"Vérifier que ton activité est compatible avec la micro-entreprise",
        pourquoi:"Certaines activités sont exclues du régime (marchands de biens, lotisseurs, agents d'affaires immobilières, location d'immeubles nus à usage professionnel, activités agricoles relevant de la MSA, officiers publics…).",
        comment:["Décris ton activité précisément (c'est elle qui détermine la nature BIC/BNC, la caisse et le code APE)","En cas de doute, pose la question au Conseiller ou à ta CCI / CMA"],
        lien:{ label:"Service-public.fr — Micro-entrepreneur", url:"https://entreprendre.service-public.fr/vosdroits/F23961" } });

      if (p.situation === "salarie") add({ id:"p_salarie", phase:"preparer", titre:"Relire ton contrat de travail (exclusivité, non-concurrence, loyauté)",
        pourquoi:"Une clause d'exclusivité peut interdire de créer une activité à côté (elle est inopposable pendant 1 an en cas de création d'entreprise, sauf pour les temps partiels). Tu dois toujours respecter l'obligation de loyauté envers ton employeur.",
        comment:["Repère les clauses d'exclusivité et de non-concurrence","Ne démarche pas les clients de ton employeur","Travaille en dehors de tes heures de travail et sans le matériel de l'employeur"],
        lien:{ label:"Cumul salarié / micro-entrepreneur", url:"https://entreprendre.service-public.fr/vosdroits/F23961" } });

      if (p.situation === "fonctionnaire") add({ id:"p_fonctionnaire", phase:"preparer", titre:"Demander l'autorisation de cumul d'activités à ton employeur public",
        pourquoi:"Un agent public ne peut exercer une activité privée lucrative qu'avec une autorisation préalable écrite (cumul d'activités) ; sans elle, tu t'exposes à des sanctions disciplinaires.",
        comment:["Adresse une demande écrite à ton autorité hiérarchique AVANT de créer","Précise la nature, la durée et le volume horaire de l'activité","Attends la réponse écrite avant l'immatriculation"],
        lien:{ label:"Cumul d'activités — fonction publique", url:"https://www.service-public.fr/particuliers/vosdroits/F20118" } });

      if (p.situation === "chomage") add({ id:"p_chomage", phase:"preparer", titre:"Informer France Travail et choisir : maintien de l'ARE ou ARCE",
        pourquoi:"Tu peux cumuler tes allocations avec tes revenus d'auto-entrepreneur (maintien de l'ARE) ou percevoir une partie de tes droits restants en capital (ARCE, versée en 2 fois). Le choix est structurant pour ta trésorerie.",
        comment:["Déclare ta création à France Travail (espace personnel)","Simule les 2 options avec ton conseiller","L'ARCE nécessite d'avoir obtenu l'ACRE"],
        lien:{ label:"France Travail — créer son entreprise", url:"https://www.francetravail.fr/candidat/vos-aides-financieres/vous-creez-ou-reprenez-une-entre.html" } });

      if (p.situation === "rsa") add({ id:"p_rsa", phase:"preparer", titre:"Prévenir la CAF / MSA de ta création d'activité",
        pourquoi:"Ton chiffre d'affaires sera pris en compte (après abattement) dans le calcul du RSA et de la prime d'activité. Le bénéfice du RSA ouvre en général droit à l'ACRE.",
        comment:["Déclare la création dans ton espace CAF","Déclare ton CA chaque trimestre dans la déclaration trimestrielle de ressources"],
        lien:{ label:"CAF — travailleurs indépendants", url:"https://www.caf.fr" } });

      if (p.situation === "etudiant") add({ id:"p_etudiant", phase:"preparer", obligatoire:false, titre:"Demander le statut national d'étudiant-entrepreneur (SNEE)",
        pourquoi:"Il te permet d'aménager tes études, de remplacer un stage par ton projet et d'être accompagné gratuitement par un Pépite. Vérifie aussi l'impact sur ta bourse et tes APL.",
        comment:["Candidate auprès du Pépite de ton établissement","Vérifie l'impact sur ta bourse (CROUS) et tes aides au logement"],
        lien:{ label:"Pépite France", url:"https://www.pepite-france.fr" } });

      if (p.situation === "retraite") add({ id:"p_retraite", phase:"preparer", titre:"Vérifier les règles du cumul emploi-retraite",
        pourquoi:"Selon que ton cumul est « intégral » ou « plafonné », tes revenus d'auto-entrepreneur peuvent réduire ta pension. Les cotisations versées peuvent ouvrir de nouveaux droits sous conditions.",
        comment:["Contacte ta caisse de retraite avant de démarrer","Informe-la de ta reprise d'activité dans le mois qui suit"],
        lien:{ label:"Cumul emploi-retraite", url:"https://www.service-public.fr/particuliers/vosdroits/F16337" } });

      if (p.activite === "artisan" && p.reglementee) add({ id:"p_qualif", phase:"preparer", titre:"Réunir la preuve de ta qualification professionnelle",

        lien:{ label:"Qualification artisanale", url:"https://entreprendre.service-public.fr/vosdroits/F24500" } });

      if (p.activite === "cipav") add({ id:"p_ordre", phase:"preparer", titre:"Vérifier les conditions d'exercice de ta profession réglementée",
        pourquoi:"Certaines professions libérales réglementées exigent un diplôme, un titre protégé ou une inscription à un ordre ou un registre (ex : architectes, psychologues — numéro ADELI/RPPS, ostéopathes).",
        comment:["Vérifie le diplôme/titre requis","Effectue l'inscription à l'ordre ou au registre professionnel si nécessaire"],
        lien:{ label:"Professions libérales réglementées", url:"https://entreprendre.service-public.fr" } });

      if (p.lieu === "domicile") add({ id:"p_domicile", phase:"preparer", titre:"Vérifier que tu peux domicilier l'entreprise chez toi",
        pourquoi:"Tu peux toujours déclarer ton adresse personnelle comme adresse de l'entreprise, mais recevoir des clients ou stocker de la marchandise peut être interdit par ton bail ou le règlement de copropriété.",
        comment:["Relis ton bail / règlement de copropriété","Si tu es locataire, informe ton bailleur par écrit","Alternative : société de domiciliation"],
        lien:{ label:"Domiciliation de l'entreprise", url:"https://entreprendre.service-public.fr/vosdroits/F2160" } });

      if (p.lieu === "local") add({ id:"p_local", phase:"preparer", titre:"Sécuriser ton local (bail, normes, accessibilité)",
        pourquoi:"Un local recevant du public doit respecter les normes ERP (sécurité incendie, accessibilité). Le type de bail (commercial, professionnel, précaire) conditionne tes droits.",
        comment:["Fais relire le bail avant de signer","Vérifie l'autorisation d'usage du local (PLU, copropriété)","Prévois l'assurance multirisque du local"],
        lien:{ label:"Choisir son local", url:"https://entreprendre.service-public.fr" } });

      if (p.lieu === "itinerant" && (p.activite === "vente" || p.activite === "artisan")) add({ id:"p_ambulant", phase:"preparer", titre:"Demander la carte de commerçant ambulant",
        pourquoi:"Obligatoire pour vendre ou exercer une activité artisanale sur les marchés, foires ou la voie publique en dehors de la commune de ton domicile.",
        comment:["Demande en ligne après l'immatriculation (CCI ou CMA)","Coût : environ 30 €, valable 4 ans","Demande aussi les autorisations d'emplacement aux mairies"],
        lien:{ label:"Carte de commerçant ambulant", url:"https://entreprendre.service-public.fr/vosdroits/F22427" } });

      add({ id:"p_nom", phase:"preparer", obligatoire:false, titre:"Vérifier que ton nom commercial est libre",
        pourquoi:"Utiliser un nom déjà déposé comme marque peut te valoir une action en contrefaçon et t'obliger à tout changer.",
        comment:["Recherche sur la base marques de l'INPI","Vérifie la disponibilité du nom de domaine et des réseaux sociaux"],
        lien:{ label:"Base marques INPI", url:"https://data.inpi.fr" } });

      add({ id:"p_simulation", phase:"preparer", obligatoire:false, titre:"Simuler tes revenus, cotisations et impôts",
        pourquoi:`En ${a.label.toLowerCase()}, tu paieras environ ${pct(a.taux)} % de cotisations sociales sur ton chiffre d'affaires encaissé (+ ${pct(a.cfp)} % de formation professionnelle), sans pouvoir déduire tes frais. Il faut fixer tes prix en conséquence.`,
        comment:["Utilise le simulateur officiel de l'Urssaf","Ou l'onglet Suivi de Cap Micro une fois ton activité lancée"],
        lien:{ label:"Simulateur mon-entreprise.urssaf.fr", url:"https://mon-entreprise.urssaf.fr/simulateurs/auto-entrepreneur" } });

      add({ id:"p_vl", phase:"preparer", obligatoire:false, titre:"Décider de l'option pour le versement libératoire de l'impôt",

        comment:["Regarde ton revenu fiscal de référence sur ton avis d'impôt N-2","Compare avec le régime classique (abattement de " + a.abattement + " %)","Option à choisir à la création, ou avant le 30 septembre pour l'année suivante"],
        lien:{ label:"Versement libératoire", url:"https://www.autoentrepreneur.urssaf.fr/portail/accueil/sinformer-sur-le-statut/lessentiel-du-statut.html" } });

      if (p.acre !== "non") add({ id:"p_acre_elig", phase:"preparer", obligatoire:false, titre:"Vérifier ton éligibilité à l'ACRE",
        pourquoi:"L'ACRE réduit tes cotisations sociales jusqu'à la fin du 3e trimestre civil qui suit ta création. Attention : depuis le 1er juillet 2026, tu paies 75 % du taux normal (exonération de 25 %, contre 50 % avant).",
        comment:["Publics éligibles notamment : demandeurs d'emploi indemnisés, bénéficiaires du RSA ou de l'ASS, 18-25 ans (et -30 ans handicapés ou non indemnisés), créateurs en QPV…","Elle n'est pas automatique : il faut la demander"],
        lien:{ label:"ACRE — Urssaf", url:"https://www.autoentrepreneur.urssaf.fr/portail/accueil/creer/lacre.html" } });

      // 2. DÉCLARER

    // ── ÉCHÉANCES ──────────────────────────────────────────────────────────

    function upcomingDeadlines(p, today = todayISO()) {
      const out = [];
      const t = new Date(today + "T12:00:00");
      const y = t.getFullYear();
      if (p.periodicite === "mensuelle") {
        for (let k = 0; k < 3; k++) {
          const m = t.getMonth() + k; // échéance à la fin du mois courant pour le mois précédent
          const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
          const due = iso(yy, mm, lastDayOfMonth(yy, mm));
          const periodLabel = new Date(yy, mm - 1, 1).toLocaleDateString("fr-FR", { month:"long", year:"numeric" });
          if (due >= today) out.push({ date:due, label:`Déclaration Urssaf du CA de ${periodLabel}`, type:"urssaf" });
        }
      } else {
        const qs = [[0,31,"4e trimestre", -1],[3,30,"1er trimestre",0],[6,31,"2e trimestre",0],[9,31,"3e trimestre",0]];
        [y, y+1].forEach(yy => qs.forEach(([m, d, lbl, off]) => {
          const due = iso(yy, m, d);
          if (due >= today) out.push({ date:due, label:`Déclaration Urssaf du CA du ${lbl} ${yy + off}`, type:"urssaf" });
        }));
      }
      const creaYear = p.dateDebut ? Number(p.dateDebut.slice(0,4)) : y;
      if (creaYear <= y) {
        const dec31 = iso(y, 11, 31);
        if (creaYear === y && dec31 >= today) out.push({ date:dec31, label:"Date limite de la déclaration initiale de CFE (1447-C-SD)", type:"impots" });
        const cfe = iso(y, 11, 15);
        if (creaYear < y && cfe >= today) out.push({ date:cfe, label:"Paiement de la CFE", type:"impots" });
        const cfeNext = iso(y+1, 11, 15);
        out.push({ date:cfeNext, label:`Paiement de la CFE ${y+1}${creaYear === y ? " (réduite de 50 %)" : ""}`, type:"impots" });
      }
      const ir = iso(y, 4, 31);
      out.push({ date: ir >= today ? ir : iso(y+1, 4, 31), label:"Déclaration de revenus (CA sur la 2042-C-PRO) — date exacte selon ton département", type:"impots" });
      const vl = iso(y, 8, 30);
      if (vl >= today) out.push({ date:vl, label:"Dernier jour pour opter ou renoncer au versement libératoire pour l'an prochain", type:"option" });
      if (REGLES.facturationElec.emission >= today) out.push({ date:REGLES.facturationElec.emission, label:"Facturation électronique : obligation d'ÉMETTRE + e-reporting", type:"efacture" });
      if (p.dateDebut && p.dateDebut > today) out.push({ date:p.dateDebut, label:"Début d'activité prévu", type:"option" });
      return out.sort((a,b) => a.date.localeCompare(b.date)).slice(0, 7);
    }

    // ── CALCULS DE SUIVI ───────────────────────────────────────────────────

    function tauxEffectif(p, dateISO) {
      const a = activiteOf(p);
      let social = a.taux;
      if (p.acre === "oui" && p.dateDebut && dateISO >= p.dateDebut) {
        // ACRE : jusqu'à la fin du 3e trimestre civil suivant la création
        const d = new Date(p.dateDebut + "T12:00:00");
        const qEnd = new Date(d.getFullYear(), Math.floor(d.getMonth()/3)*3 + 12, 0);
        if (new Date(dateISO + "T12:00:00") <= qEnd) {
          social = social * (dateISO < REGLES.acre.bascule ? REGLES.acre.avantJuillet2026 : REGLES.acre.depuisJuillet2026);
        }
      }
      return { social, cfp: a.cfp, vl: p.vl === "oui" ? a.vl : 0 };
    }

    function computeStats(p, recettes, annee) {
      const rows = recettes.filter(r => (r.date || "").startsWith(String(annee)));
      const parMois = Array(12).fill(0);
      let ca = 0, cotis = 0, impot = 0;
      rows.forEach(r => {
        const m = Number(r.date.slice(5,7)) - 1;
        const montant = Number(r.montant) || 0;
        parMois[m] += montant; ca += montant;
        const t = tauxEffectif(p, r.date);
        cotis += montant * (t.social + t.cfp) / 100;
        impot += montant * t.vl / 100;
      });
      const now = new Date();
      const moisEcoules = annee === now.getFullYear() ? now.getMonth() + 1 : 12;
      const moisActifs = parMois.slice(0, moisEcoules).filter(x => x > 0).length || 1;
      const projection = annee === now.getFullYear() ? (ca / Math.max(moisEcoules, 1)) * 12 : ca;
      return { ca, cotis, impot, net: ca - cotis - impot, parMois, projection, moyenne: ca / moisActifs, nb: rows.length };
    }

    // ── API ────────────────────────────────────────────────────────────────

    const KEY_STORAGE = "capmicro_api_key";

    const aiAvailable = () => !!APP_CONFIG.aiProxyUrl || !!localStorage.getItem(KEY_STORAGE);

    function installId() {
      let id = localStorage.getItem("capmicro_install_id");
      if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : uid() + uid()); localStorage.setItem("capmicro_install_id", id); }
      return id;
    }

    async function callAPI(system, messages, tokens = 1800) {
      if (APP_CONFIG.aiProxyUrl) {
        const res = await fetch(APP_CONFIG.aiProxyUrl, {
          method: "POST",
          headers: { "Content-Type":"application/json", "x-capmicro-client": APP_CONFIG.aiClientToken, "x-capmicro-install": installId() },
          body: JSON.stringify({ system, messages, max_tokens:tokens }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error?.message || (res.status === 429 ? "Limite quotidienne du Conseiller atteinte, réessaie demain." : `HTTP ${res.status}`));
        return data.content?.map(b => b.text || "").join("\n") || "";
      }
      const key = localStorage.getItem(KEY_STORAGE);
      if (!key) throw new Error("NO_KEY");
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model:"claude-sonnet-5", max_tokens:tokens, system, messages }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      return data.content?.map(b => b.text || "").join("\n") || "";
    }

    function extractBlocks(text, tag) {
      const re = new RegExp("```" + tag + "\\s*([\\s\\S]*?)```", "g");
      const blocks = [];
      const clean = text.replace(re, (m, body) => {
        try { blocks.push(JSON.parse(body.trim())); } catch(e) {}
        return "";
      }).trim();
      return { clean, blocks };
    }

      const lines = [

        `Activité décrite : ${p.activiteDesc || "non précisée"}`,
        `Catégorie : ${a.label} (${a.nature}, chambre : ${a.chambre}) — cotisations ${pct(a.taux)} % + CFP ${pct(a.cfp)} %`,
        `Activité artisanale réglementée : ${p.reglementee ? "oui" : "non"} · Travaux du bâtiment : ${p.batiment ? "oui" : "non"}`,
        `Situation actuelle : ${SITUATIONS.find(s => s.id === p.situation)?.label || "non précisée"}`,
        `Clientèle : ${CLIENTS.find(c => c.id === p.clients)?.label || "non précisée"}`,
        `Lieu d'exercice : ${LIEUX.find(l => l.id === p.lieu)?.label || "non précisé"} · Vente/présence en ligne : ${p.enLigne ? "oui" : "non"} · Clients/fournisseurs dans l'UE : ${p.ue ? "oui" : "non"}`,

                  <p style={{ fontSize:"12px", color:C.textFaint, marginBottom:"14px" }}>Elle change les démarches à faire avant de créer.</p>
                  <ChoiceList options={SITUATIONS} value={p.situation} onChange={v => set("situation", v)} />
                </>
              )}

              {step === 3 && (
                <>
                  <h2 style={{ fontSize:"1.15rem", fontWeight:"400", marginBottom:"14px" }}>Tes clients et ton lieu de travail</h2>
                  <SLabel>Tu travailles pour…</SLabel>
                  <div style={{ marginBottom:"14px" }}><ChoiceList options={CLIENTS} value={p.clients} onChange={v => set("clients", v)} /></div>
                  <SLabel>Tu exerces…</SLabel>
                  <div style={{ marginBottom:"14px" }}><ChoiceList options={LIEUX} value={p.lieu} onChange={v => set("lieu", v)} /></div>
                  <Toggle value={p.enLigne} onChange={v => set("enLigne", v)} label="J'ai (ou j'aurai) un site web / je vends en ligne" />
                  <Toggle value={p.ue} onChange={v => set("ue", v)} label="J'ai des clients ou fournisseurs dans d'autres pays de l'UE" />
                </>
              )}

              {step === 4 && (
                <>
                  <h2 style={{ fontSize:"1.15rem", fontWeight:"400", marginBottom:"14px" }}>Tes options</h2>
                  <Field label={p.etat === "creee" ? "Date de début d'activité" : "Date de début prévue"}>
                    <input type="date" value={p.dateDebut} onChange={e => set("dateDebut", e.target.value)} style={{ ...inputStyle, colorScheme:"dark" }} />
                  </Field>
                  <SLabel>Déclaration du chiffre d'affaires</SLabel>
                  <div style={{ marginBottom:"14px" }}><Pills options={["mensuelle","trimestrielle"]} value={p.periodicite} onChange={v => set("periodicite", v)} /></div>
                  <SLabel>Versement libératoire de l'impôt</SLabel>
                  <div style={{ marginBottom:"14px" }}><Pills options={TRISTATE} value={p.vl} onChange={v => set("vl", v)} /></div>
                  <SLabel>ACRE (aide à la création)</SLabel>
                  <div style={{ marginBottom:"14px" }}><Pills options={TRISTATE} value={p.acre} onChange={v => set("acre", v)} /></div>
                  <SLabel>TVA</SLabel>
                  <ChoiceList value={p.tva} onChange={v => set("tva", v)} options={[
                    { id:"franchise", label:"Franchise en base (je ne facture pas la TVA) — cas le plus courant" },
                    { id:"assujetti", label:"Je facture la TVA (seuil dépassé ou option volontaire)" },
                  ]} />
                </>
              )}
            </Card>

            <div style={{ display:"flex", gap:"10px" }}>
              {step > 0 ? <Btn onClick={() => setStep(step-1)}>← Retour</Btn> : onCancel ? <Btn onClick={onCancel}>Annuler</Btn> : null}
              <Btn kind="primary" disabled={!canNext} style={{ flex:1, padding:"14px", fontSize:"14px" }}
                onClick={() => step < STEPS-1 ? setStep(step+1) : onComplete(p)}>
                {step < STEPS-1 ? "Continuer →" : "Construire ma feuille de route 🚀"}
              </Btn>
            </div>
            <div style={{ fontSize:"10.5px", color:C.textFaint, textAlign:"center", marginTop:"18px", lineHeight:"1.7" }}>
              Tes données restent sur cet appareil. Cap Micro est un outil d'aide : il ne remplace pas un expert-comptable ou un avocat.
            </div>
          </div>
        </div>
      );
    }

    // ── ONGLET CRÉATION ────────────────────────────────────────────────────

    function buildDossier(p, ent) {
      const a = activiteOf(p);
      const L = [];
      L.push(`🚀 MON DOSSIER DE DÉCLARATION — préparé avec Cap Micro le ${fmtDate(todayISO())}`);
      L.push(`À saisir sur : https://formalites.entreprises.gouv.fr (service gratuit)\n`);
      L.push(`1. FORME : Entrepreneur individuel — régime micro-entrepreneur`);
      L.push(`2. IDENTITÉ : ${ent.nom || p.prenom || "[prénom NOM]"} — nom commercial : ${ent.nomCommercial || "(facultatif)"}`);
      L.push(`   Coordonnées : ${ent.email || "[e-mail]"} · ${ent.tel || "[téléphone]"}`);
      L.push(`3. ADRESSE DE L'ENTREPRISE : ${[ent.adresse, ent.cp, ent.ville].filter(Boolean).join(" ") || "[adresse]"} (${LIEUX.find(l => l.id === p.lieu)?.label || ""})`);
      L.push(`4. ACTIVITÉ PRINCIPALE : ${p.activiteDesc}`);
      L.push(`   Catégorie : ${a.label} — nature ${a.nature}${a.chambre !== "—" ? ` — rattachement ${a.chambre}` : ""}`);
      L.push(`   Exercice : ${p.lieu === "itinerant" ? "non sédentaire / chez les clients" : "sédentaire"}${p.enLigne ? " + vente/présence en ligne" : ""}`);
      if (p.activite === "artisan" && p.reglementee) L.push(`   Qualification professionnelle : joindre diplôme ou justificatifs de 3 ans d'expérience`);
      L.push(`5. DATE DE DÉBUT D'ACTIVITÉ : ${fmtDate(p.dateDebut)}`);
      L.push(`6. OPTIONS SOCIALES ET FISCALES`);
      L.push(`   - Périodicité de déclaration et de paiement : ${p.periodicite}`);
      L.push(`   - Versement libératoire de l'impôt sur le revenu : ${p.vl === "oui" ? "OUI" : p.vl === "non" ? "NON" : "à décider (demande au Conseiller)"}`);
      L.push(`   - Demande d'ACRE : ${p.acre === "oui" ? "OUI — cocher la demande" : p.acre === "non" ? "non" : "à vérifier (éligibilité)"}`);
      L.push(`   - TVA : ${p.tva === "assujetti" ? "option pour le paiement de la TVA / redevable" : "franchise en base de TVA"}`);
      L.push(`7. PIÈCES À JOINDRE`);
      L.push(`   - Pièce d'identité recto-verso`);
      L.push(`   - Justificatif de domicile de moins de 3 mois`);
      L.push(`   - Déclaration de non-condamnation (signée électroniquement)`);
      L.push(`   - Si marié(e) sous un régime de communauté : attestation d'information du conjoint`);
      L.push(`\nAPRÈS VALIDATION : attends ton SIRET (1 à 4 semaines), puis continue la checklist dans Cap Micro.`);
      L.push(`⚠️ Aucun site ne doit te faire payer cette formalité : elle est gratuite sur le guichet officiel.`);
      return L.join("\n");
    }

    function StepCard({ step, done, onToggle, onAsk }) {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ background: done ? "rgba(52,211,153,0.05)" : "rgba(255,255,255,0.035)", border:`1px solid ${done ? "rgba(52,211,153,0.25)" : C.cardBorder}`, borderRadius:"13px", marginBottom:"8px", overflow:"hidden" }}>
          <div style={{ display:"flex", gap:"10px", alignItems:"flex-start", padding:"12px" }}>
            <button onClick={onToggle} aria-label="Marquer comme fait" style={{ width:"22px", height:"22px", borderRadius:"7px", flexShrink:0, marginTop:"1px", cursor:"pointer", background: done ? C.accent : "transparent", border:`1.5px solid ${done ? C.accent : C.textFaint}`, color:"#0b1220", fontSize:"13px", fontWeight:"700" }}>{done ? "✓" : ""}</button>
            <button onClick={() => setOpen(!open)} style={{ flex:1, textAlign:"left", background:"transparent", border:"none", cursor:"pointer", color: done ? C.textFaint : C.text, fontSize:"13px", lineHeight:"1.5", textDecoration: done ? "line-through" : "none" }}>
              {step.titre}
              <span style={{ display:"inline-block", marginLeft:"8px", fontSize:"9.5px", letterSpacing:"1px", textTransform:"uppercase", padding:"2px 7px", borderRadius:"10px", textDecoration:"none", verticalAlign:"middle",
                background: step.obligatoire ? "rgba(251,113,133,0.12)" : "rgba(129,140,248,0.12)", color: step.obligatoire ? C.danger : C.accent2 }}>
                {step.obligatoire ? "obligatoire" : "conseillé"}
              </span>
            </button>
            <span onClick={() => setOpen(!open)} style={{ color:C.textFaint, fontSize:"12px", cursor:"pointer", paddingTop:"2px" }}>{open ? "▲" : "▼"}</span>
          </div>
          {open && (
            <div style={{ padding:"0 14px 14px 44px", animation:"fadeIn 0.25s ease" }}>
              <div style={{ fontSize:"12.5px", color:C.textDim, lineHeight:"1.7", marginBottom:"8px" }}>{step.pourquoi}</div>
              {step.comment.length > 0 && (
                <ul style={{ margin:"0 0 10px 16px", fontSize:"12px", color:C.textDim, lineHeight:"1.7" }}>
                  {step.comment.map((c,i) => <li key={i}>{c}</li>)}
                </ul>
              )}
              <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
                {step.lien && <a href={step.lien.url} target="_blank" rel="noopener" style={{ fontSize:"12px", color:C.accent, textDecoration:"none", border:"1px solid rgba(52,211,153,0.35)", borderRadius:"9px", padding:"7px 11px" }}>🔗 {step.lien.label}</a>}
                <Btn kind="gold" onClick={onAsk} style={{ padding:"7px 11px", fontSize:"12px" }}>💬 M'aider sur cette étape</Btn>
              </div>
            </div>
          )}
        </div>
      );
    }

    function CreationTab({ profile, store, patch, askAdvisor }) {
      const steps = useMemo(() => buildChecklist(profile), [profile]);
      const done = store.steps || {};
      const [dossier, setDossier] = useState(false);
      const [onlyTodo, setOnlyTodo] = useState(false);
      const oblig = steps.filter(s => s.obligatoire);
      const obligDone = oblig.filter(s => done[s.id]).length;
      const allDone = steps.filter(s => done[s.id]).length;
      const pct = Math.round((allDone / steps.length) * 100);
      const toggle = (id) => patch({ steps: { ...done, [id]: !done[id] } });

      return (
        <div>
          <Card>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:"8px" }}>
              <div style={{ fontSize:"15px" }}>{profile.etat === "creee" ? "Ta conformité" : "Ta feuille de route"}</div>
              <div style={{ fontSize:"22px", background:C.grad, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>{pct} %</div>
            </div>
            <div style={{ height:"7px", background:"rgba(255,255,255,0.07)", borderRadius:"6px", overflow:"hidden", marginBottom:"10px" }}>
              <div style={{ height:"100%", width:`${pct}%`, background:C.grad, transition:"width 0.4s" }}/>
            </div>
            <div style={{ fontSize:"12px", color:C.textDim, marginBottom:"12px" }}>
              {obligDone}/{oblig.length} démarches obligatoires faites · {steps.length} étapes au total, adaptées à ton profil
            </div>
            <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
              {profile.etat !== "creee" && <Btn kind="accent" onClick={() => setDossier(true)}>📄 Préparer mon dossier de déclaration</Btn>}
              <Btn onClick={() => setOnlyTodo(!onlyTodo)}>{onlyTodo ? "Tout afficher" : "Masquer les étapes faites"}</Btn>
            </div>
          </Card>

          {PHASES.map(ph => {
            const list = steps.filter(s => s.phase === ph.id);
            const visible = onlyTodo ? list.filter(s => !done[s.id]) : list;
            if (!list.length) return null;
            const d = list.filter(s => done[s.id]).length;
            return (
              <div key={ph.id} style={{ marginBottom:"18px" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", margin:"4px 2px 8px" }}>
                  <div style={{ fontSize:"11px", letterSpacing:"2px", textTransform:"uppercase", color:C.accent3 }}>{ph.emoji} {ph.label}</div>
                  <div style={{ fontSize:"11px", color: d === list.length ? C.accent : C.textFaint }}>{d}/{list.length}</div>
                </div>
                {ph.id === "efacture" && (
                  <div style={{ fontSize:"11.5px", color:C.textDim, background:"rgba(251,191,36,0.07)", border:"1px solid rgba(251,191,36,0.25)", borderRadius:"10px", padding:"9px 12px", marginBottom:"8px", lineHeight:"1.6" }}>
                    ⚡ Réception obligatoire depuis le {fmtDate(REGLES.facturationElec.reception)} · émission obligatoire dans <strong style={{ color:C.accent3 }}>{Math.max(0, daysBetween(todayISO(), REGLES.facturationElec.emission))} jours</strong> ({fmtDate(REGLES.facturationElec.emission)})
                  </div>
                )}
                {visible.map(s => <StepCard key={s.id} step={s} done={!!done[s.id]} onToggle={() => toggle(s.id)}
                  onAsk={() => askAdvisor(`Aide-moi concrètement sur l'étape « ${s.titre} » : que dois-je faire exactement dans ma situation, et peux-tu me préparer ce qu'il faut (texte à saisir, courrier, liste) ?`)} />)}
                {onlyTodo && visible.length === 0 && <div style={{ fontSize:"12px", color:C.accent, padding:"4px 4px 0" }}>✓ Phase terminée</div>}
              </div>
            );
          })}

          {dossier && <TextModal title="📄 Mon dossier de déclaration (guichet unique)" text={buildDossier(profile, store.entreprise || {})} filename="dossier-declaration-micro-entreprise.txt" onClose={() => setDossier(false)} />}
        </div>
      );
    }

    // ── FACTURATION ────────────────────────────────────────────────────────

    const EMPTY_ENT = { nom:"", nomCommercial:"", adresse:"", cp:"", ville:"", siret:"", email:"", tel:"", iban:"", bic:"", assurance:"", tvaIntra:"", penalites:"3 fois le taux d'intérêt légal", delai:30, mediateur:"" };

    function docTotals(doc, p) {
      const franchise = p.tva !== "assujetti";
      let ht = 0, tva = 0;
      (doc.lignes || []).forEach(l => {
        const lht = round2((Number(l.qte) || 0) * (Number(l.pu) || 0));
        ht += lht;
        if (!franchise) tva += round2(lht * (Number(l.tva ?? 20) / 100));
      });
      return { ht: round2(ht), tva: round2(tva), ttc: round2(ht + tva), franchise };
    }

    function natureOperation(doc) {
      const kinds = new Set((doc.lignes || []).map(l => l.nature || "service"));
      return kinds.size > 1 ? "Mixte (livraison de biens et prestation de services)" : kinds.has("bien") ? "Livraison de biens" : "Prestation de services";
    }

    function conformite(doc, ent, client, p) {
      const pro = client?.type === "pro";
      const checks = [
        { ok: !!(ent.nom && /\bEI\b|Entrepreneur individuel/i.test(ent.nom + " " + ent.nomCommercial)), label:"Ton nom suivi de la mention « EI » ou « Entrepreneur individuel »", where:"Mon entreprise" },
        { ok: !!(ent.adresse && ent.cp && ent.ville), label:"Ton adresse complète", where:"Mon entreprise" },
        { ok: /^\d{14}$/.test(ent.siret || ""), label:"Ton SIRET (14 chiffres)", where:"Mon entreprise" },
        { ok: !!client, label:"Client sélectionné", where:"Document" },
        { ok: !!(client?.adresse && client?.cp && client?.ville), label:"Adresse de facturation du client", where:"Clients" },
        { ok: !pro || /^\d{9}$/.test((client?.siren || "").replace(/\s/g,"")), label:"SIREN du client professionnel (nouvelle mention)", where:"Clients" },
        { ok: (doc.lignes || []).length > 0 && doc.lignes.every(l => l.designation && Number(l.qte) > 0), label:"Désignation et quantité de chaque ligne", where:"Document" },
        { ok: !!doc.dateOperation, label:"Date de la vente ou de la prestation", where:"Document" },
        { ok: !!doc.echeance, label:"Date d'échéance du paiement", where:"Document" },
        { ok: !(p.batiment || p.activite === "cipav") || !!ent.assurance, label:"Assurance professionnelle obligatoire (assureur, couverture)", where:"Mon entreprise" },
        { ok: !isB2C(p) || client?.type === "pro" || !!ent.mediateur, label:"Coordonnées du médiateur de la consommation (clients particuliers)", where:"Mon entreprise" },
      ];
      return checks;
    }

    function InvoicePaper({ doc, ent, client, p }) {
      const t = docTotals(doc, p);
      const isFacture = doc.type === "facture";
      const pro = client?.type === "pro";
      const cell = { padding:"7px 8px", borderBottom:"1px solid #e5e7eb", fontSize:"12px" };
      return (
        <div style={{ background:"#fff", color:"#111827", fontFamily:"Helvetica, Arial, sans-serif", padding:"34px", borderRadius:"6px", lineHeight:1.5 }}>
          <div style={{ display:"flex", justifyContent:"space-between", gap:"20px", marginBottom:"26px", flexWrap:"wrap" }}>
            <div style={{ fontSize:"12px" }}>
              <div style={{ fontSize:"16px", fontWeight:"700" }}>{ent.nomCommercial || ent.nom}</div>
              {ent.nomCommercial && <div>{ent.nom}</div>}
              <div>{ent.adresse}</div>
              <div>{ent.cp} {ent.ville}</div>
              <div>SIRET : {ent.siret}</div>
              {ent.tvaIntra && <div>N° TVA : {ent.tvaIntra}</div>}
              {ent.email && <div>{ent.email}</div>}
              {ent.tel && <div>{ent.tel}</div>}
            </div>
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:"22px", fontWeight:"700", letterSpacing:"1px" }}>{isFacture ? "FACTURE" : "DEVIS"}</div>
              <div style={{ fontSize:"12px" }}>N° {doc.numero || "(brouillon)"}</div>
              <div style={{ fontSize:"12px" }}>Date : {fmtDate(doc.date)}</div>
              {!isFacture && <div style={{ fontSize:"12px" }}>Valable jusqu'au : {fmtDate(doc.validite)}</div>}
            </div>
          </div>
          <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:"22px" }}>
            <div style={{ border:"1px solid #e5e7eb", borderRadius:"6px", padding:"12px 16px", minWidth:"240px", fontSize:"12px" }}>
              <div style={{ fontSize:"10px", textTransform:"uppercase", color:"#6b7280", letterSpacing:"1px" }}>{isFacture ? "Facturé à" : "Client"}</div>
              <div style={{ fontWeight:"700" }}>{client?.nom || "—"}</div>
              <div>{client?.adresse}</div>
              <div>{client?.cp} {client?.ville}{client?.pays && client.pays !== "France" ? ` — ${client.pays}` : ""}</div>
              {pro && client?.siren && <div>SIREN : {client.siren}</div>}
              {client?.tvaIntra && <div>N° TVA : {client.tvaIntra}</div>}
              {doc.adresseLivraison && <div style={{ marginTop:"6px" }}><span style={{ color:"#6b7280" }}>Livraison : </span>{doc.adresseLivraison}</div>}
            </div>
          </div>
          <div style={{ fontSize:"12px", marginBottom:"8px" }}>
            <strong>Nature de l'opération :</strong> {natureOperation(doc)} · <strong>Date de {natureOperation(doc).startsWith("Livraison") ? "livraison" : "réalisation"} :</strong> {fmtDate(doc.dateOperation)}
          </div>
          {doc.objet && <div style={{ fontSize:"12px", marginBottom:"10px" }}><strong>Objet :</strong> {doc.objet}</div>}
          <table style={{ width:"100%", borderCollapse:"collapse", marginBottom:"14px" }}>
            <thead>
              <tr style={{ background:"#f3f4f6" }}>
                <th style={{ ...cell, textAlign:"left" }}>Désignation</th>
                <th style={{ ...cell, textAlign:"right" }}>Qté</th>
                <th style={{ ...cell, textAlign:"right" }}>PU HT</th>
                {!t.franchise && <th style={{ ...cell, textAlign:"right" }}>TVA</th>}
                <th style={{ ...cell, textAlign:"right" }}>Total HT</th>
              </tr>
            </thead>
            <tbody>
              {(doc.lignes || []).map((l,i) => (
                <tr key={i}>
                  <td style={cell}>{l.designation}</td>
                  <td style={{ ...cell, textAlign:"right" }}>{l.qte} {l.unite || ""}</td>
                  <td style={{ ...cell, textAlign:"right" }}>{eur(l.pu)}</td>
                  {!t.franchise && <td style={{ ...cell, textAlign:"right" }}>{l.tva ?? 20} %</td>}
                  <td style={{ ...cell, textAlign:"right" }}>{eur((Number(l.qte)||0) * (Number(l.pu)||0))}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:"18px" }}>
            <div style={{ minWidth:"240px", fontSize:"13px" }}>
              <div style={{ display:"flex", justifyContent:"space-between" }}><span>Total HT</span><span>{eur(t.ht)}</span></div>
              {!t.franchise && <div style={{ display:"flex", justifyContent:"space-between" }}><span>TVA</span><span>{eur(t.tva)}</span></div>}
              <div style={{ display:"flex", justifyContent:"space-between", fontWeight:"700", fontSize:"15px", borderTop:"2px solid #111827", marginTop:"6px", paddingTop:"6px" }}>
                <span>{t.franchise ? "Net à payer" : "Total TTC"}</span><span>{eur(t.ttc)}</span>
              </div>
            </div>
          </div>
          <div style={{ fontSize:"10.5px", color:"#374151", borderTop:"1px solid #e5e7eb", paddingTop:"12px" }}>
            {t.franchise && <div><strong>TVA non applicable, art. 293 B du CGI.</strong></div>}
            {isFacture ? <>
              <div>Échéance de paiement : {fmtDate(doc.echeance)}{ent.iban ? ` — par virement : IBAN ${ent.iban}${ent.bic ? ` · BIC ${ent.bic}` : ""}` : ""}.</div>
              <div>Pas d'escompte pour paiement anticipé. En cas de retard de paiement, pénalités exigibles au taux de {ent.penalites || "3 fois le taux d'intérêt légal"}{pro ? ", et indemnité forfaitaire pour frais de recouvrement de 40 € (art. L441-10 et D441-5 du Code de commerce)" : ""}.</div>
            </> : <>
              <div>Devis gratuit. Pour accepter : retourner ce devis daté et signé avec la mention « Bon pour accord ».</div>
              <div style={{ marginTop:"18px", display:"flex", justifyContent:"space-between" }}><span>Date :</span><span style={{ minWidth:"200px" }}>Signature du client :</span></div>
              <div style={{ height:"40px" }}/>
            </>}
            {ent.assurance && <div>Assurance professionnelle : {ent.assurance}.</div>}
            {ent.mediateur && client?.type !== "pro" && <div>Médiateur de la consommation : {ent.mediateur}.</div>}
            {doc.notes && <div style={{ marginTop:"6px" }}>{doc.notes}</div>}
          </div>
        </div>
      );
    }

    function buildCII(doc, ent, client, p) {
      const t = docTotals(doc, p);
      const d = (s) => (s || todayISO()).replace(/-/g, "");
      const siren = (ent.siret || "").slice(0, 9);
      const cat = t.franchise ? "E" : "S";
      const lines = (doc.lignes || []).map((l, i) => {
        const lht = round2((Number(l.qte)||0) * (Number(l.pu)||0));
        const rate = t.franchise ? 0 : Number(l.tva ?? 20);
        return `    <ram:IncludedSupplyChainTradeLineItem>
      <ram:AssociatedDocumentLineDocument><ram:LineID>${i+1}</ram:LineID></ram:AssociatedDocumentLineDocument>
      <ram:SpecifiedTradeProduct><ram:Name>${escXml(l.designation)}</ram:Name></ram:SpecifiedTradeProduct>
      <ram:SpecifiedLineTradeAgreement><ram:NetPriceProductTradePrice><ram:ChargeAmount>${Number(l.pu||0).toFixed(2)}</ram:ChargeAmount></ram:NetPriceProductTradePrice></ram:SpecifiedLineTradeAgreement>
      <ram:SpecifiedLineTradeDelivery><ram:BilledQuantity unitCode="C62">${Number(l.qte||0)}</ram:BilledQuantity></ram:SpecifiedLineTradeDelivery>
      <ram:SpecifiedLineTradeSettlement>
        <ram:ApplicableTradeTax><ram:TypeCode>VAT</ram:TypeCode><ram:CategoryCode>${cat}</ram:CategoryCode><ram:RateApplicablePercent>${rate}</ram:RateApplicablePercent></ram:ApplicableTradeTax>
        <ram:SpecifiedTradeSettlementLineMonetarySummation><ram:LineTotalAmount>${lht.toFixed(2)}</ram:LineTotalAmount></ram:SpecifiedTradeSettlementLineMonetarySummation>
      </ram:SpecifiedLineTradeSettlement>
    </ram:IncludedSupplyChainTradeLineItem>`;
      }).join("\n");

      // Regroupement de TVA par taux
      const groups = {};
      (doc.lignes || []).forEach(l => {
        const rate = t.franchise ? 0 : Number(l.tva ?? 20);
        const lht = round2((Number(l.qte)||0) * (Number(l.pu)||0));
        groups[rate] = groups[rate] || { base:0, tax:0 };
        groups[rate].base += lht;
        groups[rate].tax += t.franchise ? 0 : round2(lht * rate / 100);
      });
      const taxes = Object.entries(groups).map(([rate, g]) => `      <ram:ApplicableTradeTax>
        <ram:CalculatedAmount>${g.tax.toFixed(2)}</ram:CalculatedAmount>
        <ram:TypeCode>VAT</ram:TypeCode>${t.franchise ? `
        <ram:ExemptionReason>TVA non applicable, art. 293 B du CGI</ram:ExemptionReason>` : ""}
        <ram:BasisAmount>${g.base.toFixed(2)}</ram:BasisAmount>
        <ram:CategoryCode>${cat}</ram:CategoryCode>${t.franchise ? `
        <ram:ExemptionReasonCode>VATEX-FR-FRANCHISE</ram:ExemptionReasonCode>` : ""}
        <ram:RateApplicablePercent>${rate}</ram:RateApplicablePercent>
      </ram:ApplicableTradeTax>`).join("\n");

      const party = (tag, name, addr, cp, ville, pays, sirenId, tvaId) => `      <ram:${tag}>
        <ram:Name>${escXml(name)}</ram:Name>${sirenId ? `
        <ram:SpecifiedLegalOrganization><ram:ID schemeID="0002">${escXml(sirenId)}</ram:ID></ram:SpecifiedLegalOrganization>` : ""}
        <ram:PostalTradeAddress>
          <ram:PostcodeCode>${escXml(cp)}</ram:PostcodeCode>
          <ram:LineOne>${escXml(addr)}</ram:LineOne>
          <ram:CityName>${escXml(ville)}</ram:CityName>
          <ram:CountryID>${escXml(pays)}</ram:CountryID>
        </ram:PostalTradeAddress>${tvaId ? `
        <ram:SpecifiedTaxRegistration><ram:ID schemeID="VA">${escXml(tvaId)}</ram:ID></ram:SpecifiedTaxRegistration>` : ""}
      </ram:${tag}>`;
      const countryCode = (c) => !c || /^france$/i.test(c) ? "FR" : c.length === 2 ? c.toUpperCase() : c.slice(0,2).toUpperCase();

      return `<?xml version="1.0" encoding="UTF-8"?>
<!-- Généré par Cap Micro — format CII (UN/CEFACT), profil EN 16931. À transmettre via ta plateforme agréée. -->
<rsm:CrossIndustryInvoice xmlns:rsm="urn:un:unece:uncefact:data:standard:CrossIndustryInvoice:100" xmlns:ram="urn:un:unece:uncefact:data:standard:ReusableAggregateBusinessInformationEntity:100" xmlns:udt="urn:un:unece:uncefact:data:standard:UnqualifiedDataType:100">
  <rsm:ExchangedDocumentContext>
    <ram:GuidelineSpecifiedDocumentContextParameter><ram:ID>urn:cen.eu:en16931:2017</ram:ID></ram:GuidelineSpecifiedDocumentContextParameter>
  </rsm:ExchangedDocumentContext>
  <rsm:ExchangedDocument>
    <ram:ID>${escXml(doc.numero)}</ram:ID>
    <ram:TypeCode>380</ram:TypeCode>
    <ram:IssueDateTime><udt:DateTimeString format="102">${d(doc.date)}</udt:DateTimeString></ram:IssueDateTime>${t.franchise ? `
    <ram:IncludedNote><ram:Content>TVA non applicable, art. 293 B du CGI</ram:Content></ram:IncludedNote>` : ""}
    <ram:IncludedNote><ram:Content>Nature de l'opération : ${escXml(natureOperation(doc))}</ram:Content></ram:IncludedNote>
  </rsm:ExchangedDocument>
  <rsm:SupplyChainTradeTransaction>
${lines}
    <ram:ApplicableHeaderTradeAgreement>
${party("SellerTradeParty", ent.nom, ent.adresse, ent.cp, ent.ville, "FR", siren, ent.tvaIntra)}
${party("BuyerTradeParty", client?.nom, client?.adresse, client?.cp, client?.ville, countryCode(client?.pays), client?.type === "pro" ? (client?.siren || "").replace(/\s/g,"") : "", client?.tvaIntra)}
    </ram:ApplicableHeaderTradeAgreement>
    <ram:ApplicableHeaderTradeDelivery>
      <ram:ActualDeliverySupplyChainEvent><ram:OccurrenceDateTime><udt:DateTimeString format="102">${d(doc.dateOperation)}</udt:DateTimeString></ram:OccurrenceDateTime></ram:ActualDeliverySupplyChainEvent>
    </ram:ApplicableHeaderTradeDelivery>
    <ram:ApplicableHeaderTradeSettlement>
      <ram:InvoiceCurrencyCode>EUR</ram:InvoiceCurrencyCode>${ent.iban ? `
      <ram:SpecifiedTradeSettlementPaymentMeans>
        <ram:TypeCode>58</ram:TypeCode>
        <ram:PayeePartyCreditorFinancialAccount><ram:IBANID>${escXml(ent.iban.replace(/\s/g,""))}</ram:IBANID></ram:PayeePartyCreditorFinancialAccount>
      </ram:SpecifiedTradeSettlementPaymentMeans>` : ""}
${taxes}
      <ram:SpecifiedTradePaymentTerms>
        <ram:Description>Pénalités de retard : ${escXml(ent.penalites)}${client?.type === "pro" ? " ; indemnité forfaitaire de recouvrement : 40 EUR" : ""}</ram:Description>
        <ram:DueDateDateTime><udt:DateTimeString format="102">${d(doc.echeance)}</udt:DateTimeString></ram:DueDateDateTime>
      </ram:SpecifiedTradePaymentTerms>
      <ram:SpecifiedTradeSettlementHeaderMonetarySummation>
        <ram:LineTotalAmount>${t.ht.toFixed(2)}</ram:LineTotalAmount>
        <ram:TaxBasisTotalAmount>${t.ht.toFixed(2)}</ram:TaxBasisTotalAmount>
        <ram:TaxTotalAmount currencyID="EUR">${t.tva.toFixed(2)}</ram:TaxTotalAmount>
        <ram:GrandTotalAmount>${t.ttc.toFixed(2)}</ram:GrandTotalAmount>
        <ram:DuePayableAmount>${t.ttc.toFixed(2)}</ram:DuePayableAmount>
      </ram:SpecifiedTradeSettlementHeaderMonetarySummation>
    </ram:ApplicableHeaderTradeSettlement>
  </rsm:SupplyChainTradeTransaction>
</rsm:CrossIndustryInvoice>
`;
    }

    function nextNumero(docs, type, dateISO) {
      const prefix = `${type === "facture" ? "F" : "D"}-${dateISO.slice(0,4)}-`;
      const max = docs.filter(d => d.numero?.startsWith(prefix)).reduce((m, d) => Math.max(m, Number(d.numero.slice(prefix.length)) || 0), 0);
      return prefix + String(max + 1).padStart(4, "0");
    }

    function EntrepriseForm({ ent, setEnt, profile }) {
      const f = (k) => ({ value: ent[k], onChange: v => setEnt({ ...ent, [k]: v }) });
      return (
        <Card>
          <div style={{ fontSize:"14px", marginBottom:"4px" }}>🏢 Mon entreprise</div>
          <div style={{ fontSize:"11.5px", color:C.textFaint, marginBottom:"14px" }}>Ces informations apparaissent sur tous tes devis et factures.</div>
          <Field label="Nom et prénom + « EI » (obligatoire)"><Input {...f("nom")} placeholder="ex : Camille MARTIN EI" /></Field>
          {ent.nom && !/\bEI\b|Entrepreneur individuel/i.test(ent.nom) && (
            <div style={{ fontSize:"11px", color:C.accent3, margin:"-6px 0 12px" }}>⚠️ Ajoute « EI » : <button onClick={() => setEnt({ ...ent, nom: ent.nom.trim() + " EI" })} style={{ background:"transparent", border:"none", color:C.accent, cursor:"pointer", textDecoration:"underline", fontSize:"11px" }}>corriger automatiquement</button></div>
          )}
          <Field label="Nom commercial (facultatif)"><Input {...f("nomCommercial")} /></Field>
          <Field label="Adresse"><Input {...f("adresse")} /></Field>
          <div style={{ display:"flex", gap:"10px" }}>
            <Field label="Code postal" style={{ flex:"0 0 110px" }}><Input {...f("cp")} inputMode="numeric" /></Field>
            <Field label="Ville" style={{ flex:1 }}><Input {...f("ville")} /></Field>
          </div>
          <Field label="SIRET (14 chiffres)"><Input value={ent.siret} onChange={v => setEnt({ ...ent, siret: v.replace(/[^0-9]/g,"").slice(0,14) })} inputMode="numeric" placeholder={profile.siret || ""} /></Field>
          <div style={{ display:"flex", gap:"10px", flexWrap:"wrap" }}>
            <Field label="E-mail" style={{ flex:1, minWidth:"180px" }}><Input {...f("email")} type="email" /></Field>
            <Field label="Téléphone" style={{ flex:1, minWidth:"140px" }}><Input {...f("tel")} /></Field>
          </div>
          <div style={{ display:"flex", gap:"10px", flexWrap:"wrap" }}>
            <Field label="IBAN" style={{ flex:2, minWidth:"200px" }}><Input {...f("iban")} /></Field>
            <Field label="BIC" style={{ flex:1, minWidth:"110px" }}><Input {...f("bic")} /></Field>
          </div>
          {profile.ue && <Field label="N° TVA intracommunautaire"><Input {...f("tvaIntra")} placeholder="FR…" /></Field>}
          <Field label={`Assurance pro (assureur, n° contrat, couverture)${profile.batiment || profile.activite === "cipav" ? " — obligatoire" : ""}`}><Input {...f("assurance")} placeholder="ex : Décennale XYZ Assurances n°123, couverture France" /></Field>
          {isB2C(profile) && <Field label="Médiateur de la consommation (nom, site) — obligatoire B2C"><Input {...f("mediateur")} /></Field>}
          <div style={{ display:"flex", gap:"10px", flexWrap:"wrap" }}>
            <Field label="Taux des pénalités de retard" style={{ flex:2, minWidth:"200px" }}><Input {...f("penalites")} /></Field>
            <Field label="Délai de paiement (jours)" style={{ flex:1, minWidth:"120px" }}><Input value={ent.delai} onChange={v => setEnt({ ...ent, delai: v.replace(/[^0-9]/g,"") })} inputMode="numeric" /></Field>
          </div>
          <div style={{ fontSize:"11px", color:C.textFaint }}>Délai légal maximal entre professionnels : 60 jours date de facture (ou 45 jours fin de mois).</div>
        </Card>
      );
    }

    function ClientsPanel({ clients, setClients }) {
      const [edit, setEdit] = useState(null);
      const save = () => {
        const exists = clients.some(c => c.id === edit.id);
        setClients(exists ? clients.map(c => c.id === edit.id ? edit : c) : [...clients, edit]);
        setEdit(null);
      };
      const f = (k) => ({ value: edit[k], onChange: v => setEdit({ ...edit, [k]: v }) });
      return (
        <Card>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"12px" }}>
            <div style={{ fontSize:"14px" }}>👥 Mes clients</div>
            <Btn kind="accent" onClick={() => setEdit({ id:uid(), type:"pro", nom:"", adresse:"", cp:"", ville:"", pays:"France", siren:"", email:"", tvaIntra:"" })}>+ Client</Btn>
          </div>
          {clients.length === 0 && <div style={{ fontSize:"12px", color:C.textFaint, fontStyle:"italic" }}>Aucun client pour l'instant.</div>}
          {clients.map(c => (
            <div key={c.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderTop:`1px solid ${C.cardBorder}`, gap:"10px" }}>
              <div style={{ fontSize:"13px" }}>
                {c.nom} <span style={{ fontSize:"11px", color:C.textFaint }}>· {c.type === "pro" ? "pro" : "particulier"}{c.ville ? ` · ${c.ville}` : ""}</span>
                {c.type === "pro" && !/^\d{9}$/.test((c.siren||"").replace(/\s/g,"")) && <div style={{ fontSize:"11px", color:C.accent3 }}>⚠️ SIREN manquant (obligatoire sur les factures)</div>}
              </div>
              <div style={{ display:"flex", gap:"6px" }}>
                <Btn onClick={() => setEdit(c)} style={{ padding:"6px 10px" }}>Modifier</Btn>
              </div>
            </div>
          ))}
          {edit && (
            <Modal onClose={() => setEdit(null)}>
              <div style={{ fontSize:"14px", color:C.accent, marginBottom:"12px" }}>Client</div>
              <div style={{ marginBottom:"12px" }}><Pills options={["pro","particulier"]} value={edit.type} onChange={v => setEdit({ ...edit, type:v })} /></div>
              <Field label={edit.type === "pro" ? "Raison sociale" : "Nom et prénom"}><Input {...f("nom")} /></Field>
              {edit.type === "pro" && <Field label="SIREN (9 chiffres) — obligatoire"><Input value={edit.siren} onChange={v => setEdit({ ...edit, siren: v.replace(/[^0-9]/g,"").slice(0,9) })} inputMode="numeric" /></Field>}
              {edit.type === "pro" && <div style={{ fontSize:"11px", color:C.textFaint, margin:"-6px 0 12px" }}>Trouve-le sur <a href="https://annuaire-entreprises.data.gouv.fr" target="_blank" rel="noopener" style={{ color:C.accent }}>annuaire-entreprises.data.gouv.fr</a></div>}
              <Field label="Adresse de facturation"><Input {...f("adresse")} /></Field>
              <div style={{ display:"flex", gap:"10px" }}>
                <Field label="Code postal" style={{ flex:"0 0 110px" }}><Input {...f("cp")} /></Field>
                <Field label="Ville" style={{ flex:1 }}><Input {...f("ville")} /></Field>
              </div>
              <Field label="Pays"><Input {...f("pays")} /></Field>
              <Field label="E-mail"><Input {...f("email")} /></Field>
              {edit.type === "pro" && <Field label="N° TVA intracommunautaire (si UE)"><Input {...f("tvaIntra")} /></Field>}
              <div style={{ display:"flex", gap:"8px" }}>
                <Btn kind="primary" onClick={save} disabled={!edit.nom.trim()} style={{ flex:1 }}>Enregistrer</Btn>
                {clients.some(c => c.id === edit.id) && <Btn kind="danger" onClick={() => { if (confirm("Supprimer ce client ?")) { setClients(clients.filter(c => c.id !== edit.id)); setEdit(null); } }}>Supprimer</Btn>}
              </div>
            </Modal>
          )}
        </Card>
      );
    }

    function DocEditor({ doc, setDoc, onClose, onEmit, onPaid, onDelete, onConvert, ent, clients, profile }) {
      const client = clients.find(c => c.id === doc.clientId);
      const locked = !!doc.numero && doc.type === "facture";
      const [preview, setPreview] = useState(false);
      const [pdfBusy, setPdfBusy] = useState(false);
      const [paid, setPaid] = useState({ date: todayISO(), mode:"Virement" });
      const checks = conformite(doc, ent, client, profile);
      const ko = checks.filter(c => !c.ok);
      const t = docTotals(doc, profile);
      const setLine = (i, k, v) => setDoc({ ...doc, lignes: doc.lignes.map((l,j) => j === i ? { ...l, [k]: v } : l) });
      const franchise = profile.tva !== "assujetti";

      return (
        <Modal onClose={onClose} wide>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"14px" }}>
            <div style={{ fontSize:"15px", color:C.accent }}>{doc.type === "facture" ? "🧾 Facture" : "📋 Devis"} {doc.numero || "(brouillon)"}</div>
            <Btn onClick={onClose} style={{ padding:"6px 10px" }}>✕</Btn>
          </div>
          {locked && <div style={{ fontSize:"11.5px", color:C.accent3, background:"rgba(251,191,36,0.08)", border:"1px solid rgba(251,191,36,0.3)", borderRadius:"10px", padding:"9px 12px", marginBottom:"12px" }}>🔒 Facture émise : elle ne peut plus être modifiée ni supprimée. Pour la corriger ou l'annuler, émets une facture d'avoir.</div>}

          <fieldset disabled={locked} style={{ border:"none" }}>
            <div style={{ display:"flex", gap:"10px", flexWrap:"wrap" }}>
              <Field label="Client" style={{ flex:2, minWidth:"200px" }}>
                <Select value={doc.clientId} onChange={v => setDoc({ ...doc, clientId:v })} options={[{ value:"", label:"— Choisir —" }, ...clients.map(c => ({ value:c.id, label:c.nom }))]} />
              </Field>
              <Field label="Date du document" style={{ flex:1, minWidth:"140px" }}>
                <input type="date" value={doc.date} onChange={e => setDoc({ ...doc, date:e.target.value })} style={{ ...inputStyle, colorScheme:"dark" }} />
              </Field>
            </div>
            {clients.length === 0 && <div style={{ fontSize:"11.5px", color:C.accent3, margin:"-6px 0 12px" }}>Ajoute d'abord un client dans « Clients ».</div>}
            <Field label="Objet (facultatif)"><Input value={doc.objet} onChange={v => setDoc({ ...doc, objet:v })} /></Field>

            <SLabel>Lignes</SLabel>
            {doc.lignes.map((l,i) => (
              <div key={i} style={{ background:"rgba(255,255,255,0.03)", border:`1px solid ${C.cardBorder}`, borderRadius:"10px", padding:"10px", marginBottom:"8px" }}>
                <input value={l.designation} onChange={e => setLine(i,"designation",e.target.value)} placeholder="Désignation précise" style={{ ...inputStyle, marginBottom:"8px" }} />
                <div style={{ display:"flex", gap:"8px", flexWrap:"wrap", alignItems:"center" }}>
                  <input value={l.qte} onChange={e => setLine(i,"qte",e.target.value.replace(",","."))} placeholder="Qté" inputMode="decimal" style={{ ...inputStyle, width:"70px" }} />
                  <input value={l.unite || ""} onChange={e => setLine(i,"unite",e.target.value)} placeholder="unité" style={{ ...inputStyle, width:"80px" }} />
                  <input value={l.pu} onChange={e => setLine(i,"pu",e.target.value.replace(",","."))} placeholder="PU HT €" inputMode="decimal" style={{ ...inputStyle, width:"100px" }} />
                  {!franchise && <select value={l.tva ?? 20} onChange={e => setLine(i,"tva",Number(e.target.value))} style={{ ...inputStyle, width:"80px" }}>{[20,10,5.5,2.1,0].map(r => <option key={r} value={r}>{r} %</option>)}</select>}
                  <select value={l.nature || "service"} onChange={e => setLine(i,"nature",e.target.value)} style={{ ...inputStyle, width:"110px" }}>
                    <option value="service">Service</option><option value="bien">Bien</option>
                  </select>
                  <span style={{ marginLeft:"auto", fontSize:"13px", color:C.textDim }}>{eur((Number(l.qte)||0)*(Number(l.pu)||0))}</span>
                  {doc.lignes.length > 1 && <button onClick={() => setDoc({ ...doc, lignes: doc.lignes.filter((_,j)=>j!==i) })} style={{ background:"transparent", border:"none", color:C.danger, cursor:"pointer", fontSize:"16px" }}>×</button>}
                </div>
              </div>
            ))}
            <Btn onClick={() => setDoc({ ...doc, lignes:[...doc.lignes, { designation:"", qte:1, pu:"", nature: profile.activite === "vente" ? "bien" : "service" }] })} style={{ marginBottom:"14px" }}>+ Ligne</Btn>

            <div style={{ display:"flex", gap:"10px", flexWrap:"wrap" }}>
              <Field label="Date de la vente / prestation" style={{ flex:1, minWidth:"150px" }}>
                <input type="date" value={doc.dateOperation} onChange={e => setDoc({ ...doc, dateOperation:e.target.value })} style={{ ...inputStyle, colorScheme:"dark" }} />
              </Field>
              {doc.type === "facture" ? (
                <Field label="Échéance de paiement" style={{ flex:1, minWidth:"150px" }}>
                  <input type="date" value={doc.echeance} onChange={e => setDoc({ ...doc, echeance:e.target.value })} style={{ ...inputStyle, colorScheme:"dark" }} />
                </Field>
              ) : (
                <Field label="Devis valable jusqu'au" style={{ flex:1, minWidth:"150px" }}>
                  <input type="date" value={doc.validite} onChange={e => setDoc({ ...doc, validite:e.target.value })} style={{ ...inputStyle, colorScheme:"dark" }} />
                </Field>
              )}
            </div>
            <Field label="Adresse de livraison (si différente de l'adresse de facturation)"><Input value={doc.adresseLivraison} onChange={v => setDoc({ ...doc, adresseLivraison:v })} /></Field>
            <Field label="Notes / conditions particulières"><Input value={doc.notes} onChange={v => setDoc({ ...doc, notes:v })} /></Field>
          </fieldset>

          <div style={{ display:"flex", justifyContent:"space-between", fontSize:"15px", margin:"6px 0 14px" }}>
            <span style={{ color:C.textDim }}>{franchise ? "Total (TVA non applicable)" : `Total HT ${eur(t.ht)} · TVA ${eur(t.tva)} · TTC`}</span>
            <strong style={{ color:C.accent }}>{eur(t.ttc)}</strong>
          </div>

          <div style={{ background: ko.length ? "rgba(251,191,36,0.07)" : "rgba(52,211,153,0.07)", border:`1px solid ${ko.length ? "rgba(251,191,36,0.3)" : "rgba(52,211,153,0.3)"}`, borderRadius:"12px", padding:"12px", marginBottom:"14px" }}>
            <div style={{ fontSize:"12.5px", marginBottom:"6px", color: ko.length ? C.accent3 : C.accent }}>
              {ko.length ? `⚠️ ${ko.length} mention(s) obligatoire(s) à compléter (${REGLES.penaliteMention} € d'amende par mention manquante)` : "✓ Toutes les mentions obligatoires sont présentes"}
            </div>
            {ko.map((c,i) => <div key={i} style={{ fontSize:"11.5px", color:C.textDim }}>• {c.label} <span style={{ color:C.textFaint }}>→ {c.where}</span></div>)}
          </div>

          <div style={{ display:"flex", gap:"8px", flexWrap:"wrap" }}>
            <Btn onClick={() => setPreview(true)}>👁 Aperçu / PDF</Btn>
            {!doc.numero && <Btn kind="primary" disabled={ko.length > 0} onClick={onEmit}>{doc.type === "facture" ? "Valider et émettre la facture" : "Valider le devis"}</Btn>}
            {doc.type === "facture" && doc.numero && <Btn kind="accent" onClick={() => downloadFile(`${doc.numero}.xml`, buildCII(doc, ent, client, profile), "application/xml")}>⬇ XML CII (EN 16931)</Btn>}
            {doc.type === "devis" && doc.numero && <Btn kind="gold" onClick={onConvert}>→ Transformer en facture</Btn>}
            {(!locked) && <Btn kind="danger" onClick={onDelete} style={{ marginLeft:"auto" }}>Supprimer</Btn>}
          </div>

          {doc.type === "facture" && doc.numero && (
            <div style={{ marginTop:"14px", borderTop:`1px solid ${C.cardBorder}`, paddingTop:"14px" }}>
              {doc.payeLe ? (
                <div style={{ fontSize:"12.5px", color:C.accent }}>✓ Payée le {fmtDate(doc.payeLe)} ({doc.modePaiement}) — inscrite au livre des recettes.</div>
              ) : (
                <div style={{ display:"flex", gap:"8px", flexWrap:"wrap", alignItems:"center" }}>
                  <span style={{ fontSize:"12px", color:C.textDim }}>Encaissement :</span>
                  <input type="date" value={paid.date} onChange={e => setPaid({ ...paid, date:e.target.value })} style={{ ...inputStyle, width:"150px", colorScheme:"dark" }} />
                  <select value={paid.mode} onChange={e => setPaid({ ...paid, mode:e.target.value })} style={{ ...inputStyle, width:"130px" }}>
                    {["Virement","Carte","Chèque","Espèces","Autre"].map(m => <option key={m}>{m}</option>)}
                  </select>
                  <Btn kind="accent" onClick={() => onPaid(paid)}>Marquer payée</Btn>
                </div>
              )}
            </div>
          )}

          {preview && (
            <div onClick={() => setPreview(false)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:3000, overflowY:"auto", padding:"16px" }}>
              <div onClick={e => e.stopPropagation()} style={{ maxWidth:"780px", margin:"0 auto" }}>
                <div className="no-print" style={{ display:"flex", gap:"8px", marginBottom:"10px" }}>
                  <Btn kind="primary" disabled={pdfBusy} onClick={async () => {
                    setPdfBusy(true);
                    try { await exportPdf(`${doc.numero || (doc.type === "facture" ? "facture-brouillon" : "devis-brouillon")}.pdf`); }
                    catch(e) { alert("Création du PDF impossible : " + e.message); }
                    setPdfBusy(false);
                  }}>{pdfBusy ? "Création du PDF…" : "📄 Télécharger le PDF"}</Btn>
                  {!IS_NATIVE && <Btn onClick={() => window.print()}>🖨 Imprimer</Btn>}
                  <Btn onClick={() => setPreview(false)}>Fermer</Btn>
                </div>
                <InvoicePaper doc={doc} ent={ent} client={client} p={profile} />
                {ReactDOM.createPortal(<div id="print-area"><InvoicePaper doc={doc} ent={ent} client={client} p={profile} /></div>, document.body)}

        { id:"f_annuaire", label:"Je suis inscrit(e) dans l'annuaire de facturation" },
        { id:"f_mentions", label:"Mes modèles intègrent les nouvelles mentions (SIREN client, nature, livraison)" },

        <Card style={{ borderColor:"rgba(251,191,36,0.35)" }}>

          <div style={{ display:"flex", gap:"10px", marginBottom:"12px", flexWrap:"wrap" }}>
            <div style={{ flex:1, minWidth:"140px", background:"rgba(52,211,153,0.07)", borderRadius:"10px", padding:"10px" }}>
              <div style={{ fontSize:"10px", color:C.textFaint, letterSpacing:"1.5px", textTransform:"uppercase" }}>Réception</div>
              <div style={{ fontSize:"13px", color:C.accent }}>Obligatoire depuis le {fmtDate(REGLES.facturationElec.reception)}</div>
            </div>
            <div style={{ flex:1, minWidth:"140px", background:"rgba(251,191,36,0.07)", borderRadius:"10px", padding:"10px" }}>
              <div style={{ fontSize:"10px", color:C.textFaint, letterSpacing:"1.5px", textTransform:"uppercase" }}>Émission + e-reporting</div>
              <div style={{ fontSize:"13px", color:C.accent3 }}>{fmtDate(REGLES.facturationElec.emission)} · J-{Math.max(0,jours)}</div>
            </div>
          </div>
          <div style={{ fontSize:"12px", color:C.textDim, marginBottom:"8px" }}>Ton niveau de préparation : <strong style={{ color: score === items.length ? C.accent : C.accent3 }}>{score}/{items.length}</strong></div>
          {items.map(i => <Toggle key={i.id} value={!!done[i.id]} onChange={v => patch({ steps: { ...done, [i.id]: v } })} label={(i.urgent && !done[i.id] ? "🔴 " : "") + i.label} />)}
          <a href="https://www.impots.gouv.fr/facturation-electronique-et-plateformes-agreees" target="_blank" rel="noopener" style={{ fontSize:"12px", color:C.accent }}>🔗 Liste officielle des plateformes agréées</a>
        </Card>
      );
