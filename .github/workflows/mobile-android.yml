# Compile l'application Android.
# - Sans secrets : APK de test (debug), téléchargeable dans les « Artifacts » du run.
# - Avec les secrets de signature : AAB signé pour Google Play (+ envoi optionnel sur la piste de test interne).
name: Mobile Android

on:
  push:
    paths: ["cap-micro.html", "mobile/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:
    inputs:
      envoyer_play:
        description: "Envoyer l'AAB sur Google Play (piste de test interne)"
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CAPMICRO_AI_PROXY_URL: ${{ vars.CAPMICRO_AI_PROXY_URL }}
      CAPMICRO_AI_CLIENT_TOKEN: ${{ vars.CAPMICRO_AI_CLIENT_TOKEN }}
      CAPMICRO_VERSION_CODE: ${{ github.run_number }}
      CAPMICRO_VERSION_NAME: ${{ vars.CAPMICRO_VERSION_NAME || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: node scripts/build-web.mjs
      - run: npx cap sync android

      - name: Clé de signature
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: AAB signé (Google Play)
        if: steps.keystore.outputs.path != ''
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: APK de test (sans signature de publication)
        if: steps.keystore.outputs.path == ''
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cap-micro-android-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Envoi sur Google Play (test interne)
        if: inputs.envoyer_play && steps.keystore.outputs.path != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.capmicro.app
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
